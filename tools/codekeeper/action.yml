name: Codekeeper tooling bootstrap
description: Stage the pinned production Codekeeper runtime as a verified run artifact with an optional exact cache.

inputs:
  artifact-name:
    description: Exact run-scoped fallback artifact name derived from github.run_id.
    required: true
  cache-key:
    description: Immutable cache key containing the pinned production tooling manifest digest.
    required: false
  manifest-sha256:
    description: Expected SHA-256 digest of the pinned production tooling manifest.
    required: false

runs:
  using: composite
  steps:
    - name: Select bootstrap transport
      id: transport
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        CACHE_KEY: ${{ inputs.cache-key }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_WORKSPACE_ROOT: ${{ github.workspace }}
        MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
        RUNNER_TEMP_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        test -n "$ARTIFACT_NAME" || {
          echo "Codekeeper tooling bootstrap requires an artifact fallback" >&2
          exit 1
        }
        echo "artifact-root=$RUNNER_TEMP_ROOT/codekeeper-tooling" >> "$GITHUB_OUTPUT"
        if test -z "$CACHE_KEY" && test -z "$MANIFEST_SHA256"; then
          echo "mode=artifact" >> "$GITHUB_OUTPUT"
          echo "destination=$RUNNER_TEMP_ROOT/codekeeper-tooling" >> "$GITHUB_OUTPUT"
          echo "staging-root=$RUNNER_TEMP_ROOT/codekeeper-tooling" >> "$GITHUB_OUTPUT"
          echo "tooling-root=$RUNNER_TEMP_ROOT/codekeeper-tooling/tooling/tools/codekeeper" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        test -n "$CACHE_KEY" && test -n "$MANIFEST_SHA256" || {
          echo "Codekeeper tooling cache requires both cache-key and manifest-sha256" >&2
          exit 1
        }
        echo "mode=cache" >> "$GITHUB_OUTPUT"
        echo "destination=$GITHUB_WORKSPACE_ROOT/tooling" >> "$GITHUB_OUTPUT"
        echo "staging-root=$GITHUB_WORKSPACE_ROOT" >> "$GITHUB_OUTPUT"
        echo "tooling-root=$GITHUB_WORKSPACE_ROOT/tooling/tools/codekeeper" >> "$GITHUB_OUTPUT"
        case "$EVENT_NAME" in
          push|workflow_dispatch|repository_dispatch|delete|registry_package|page_build|schedule)
            echo "cache-write=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "cache-write=false" >> "$GITHUB_OUTPUT"
            ;;
        esac

    - name: Require empty tooling destinations
      shell: bash
      env:
        ARTIFACT_ROOT: ${{ steps.transport.outputs.artifact-root }}
        DESTINATION: ${{ steps.transport.outputs.destination }}
        TRANSPORT_MODE: ${{ steps.transport.outputs.mode }}
      run: |
        set -euo pipefail
        test ! -e "$DESTINATION" || {
          echo "Codekeeper tooling bootstrap destination already exists" >&2
          exit 1
        }
        if test "$TRANSPORT_MODE" = cache; then
          test ! -e "$ARTIFACT_ROOT" || {
            echo "Codekeeper tooling fallback destination already exists" >&2
            exit 1
          }
        fi

    - name: Restore pinned production tooling cache
      if: steps.transport.outputs.mode == 'cache'
      id: tooling-cache
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ github.workspace }}/tooling
        key: ${{ inputs.cache-key }}

    - name: Stage pinned production tooling
      if: steps.transport.outputs.mode == 'artifact' || steps.tooling-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        STAGING_ROOT: ${{ steps.transport.outputs.staging-root }}
      run: |
        set -euo pipefail
        target="$STAGING_ROOT/tooling/tools/codekeeper"
        if test -e "$STAGING_ROOT/tooling"; then
          echo "Codekeeper tooling bootstrap staging path already exists" >&2
          exit 1
        fi
        mkdir -p "$target/scripts"
        for file in package.json package-lock.json tooling-manifest.json; do
          if ! test -f "$ACTION_PATH/$file" || test -L "$ACTION_PATH/$file"; then
            echo "Codekeeper tooling bootstrap refused an invalid file: $file" >&2
            exit 1
          fi
          cp "$ACTION_PATH/$file" "$target/$file"
        done
        if ! test -f "$ACTION_PATH/scripts/verify-tooling-artifact.mjs" || test -L "$ACTION_PATH/scripts/verify-tooling-artifact.mjs"; then
          echo "Codekeeper tooling bootstrap refused an invalid verifier" >&2
          exit 1
        fi
        cp "$ACTION_PATH/scripts/verify-tooling-artifact.mjs" "$target/scripts/verify-tooling-artifact.mjs"
        for directory in agents integrations/braintrust presets src; do
          if ! test -d "$ACTION_PATH/$directory" || test -L "$ACTION_PATH/$directory"; then
            echo "Codekeeper tooling bootstrap refused an invalid directory: $directory" >&2
            exit 1
          fi
          if find "$ACTION_PATH/$directory" -type l -print -quit | grep -q .; then
            echo "Codekeeper tooling bootstrap refused a tooling symlink" >&2
            exit 1
          fi
          if find "$ACTION_PATH/$directory" -name '.*' -print -quit | grep -q .; then
            echo "Codekeeper tooling bootstrap refused a hidden tooling path" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$target/$directory")"
          cp -R "$ACTION_PATH/$directory" "$target/$directory"
        done
        if find "$target" -type l -print -quit | grep -q .; then
          echo "Codekeeper tooling bootstrap created a symlink" >&2
          exit 1
        fi
        if find "$target" -name '.*' -print -quit | grep -q .; then
          echo "Codekeeper tooling bootstrap created a hidden path" >&2
          exit 1
        fi
        true

    - name: Verify pinned production tooling
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXPECTED_CACHE_KEY: ${{ inputs.cache-key }}
        EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
        RUNNER_OS_NAME: ${{ runner.os }}
        TRANSPORT_MODE: ${{ steps.transport.outputs.mode }}
        TOOLING_ROOT: ${{ steps.transport.outputs.tooling-root }}
      run: |
        set -euo pipefail
        source_manifest_sha256="$(sha256sum "$ACTION_PATH/tooling-manifest.json" | awk '{print $1}')"
        if test "$TRANSPORT_MODE" = cache; then
          test "$EXPECTED_MANIFEST_SHA256" = "$source_manifest_sha256" || {
            echo "Codekeeper tooling cache manifest is not bound to this pinned action" >&2
            exit 1
          }
          test "$EXPECTED_CACHE_KEY" = "codekeeper-tooling-$RUNNER_OS_NAME-$source_manifest_sha256" || {
            echo "Codekeeper tooling cache key is not bound to this pinned manifest" >&2
            exit 1
          }
        fi
        test "$(sha256sum "$TOOLING_ROOT/tooling-manifest.json" | awk '{print $1}')" = "$source_manifest_sha256" || {
          echo "Codekeeper tooling cache manifest does not match the pinned workflow" >&2
          exit 1
        }
        cmp "$ACTION_PATH/tooling-manifest.json" "$TOOLING_ROOT/tooling-manifest.json"
        node "$ACTION_PATH/scripts/verify-tooling-artifact.mjs" \
          --root "$TOOLING_ROOT" \
          --expected-manifest-sha256 "$source_manifest_sha256"

    - name: Save pinned production tooling cache
      if: steps.transport.outputs.mode == 'cache' && steps.transport.outputs.cache-write == 'true' && steps.tooling-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ github.workspace }}/tooling
        key: ${{ inputs.cache-key }}

    - name: Prepare pinned production tooling artifact fallback
      if: steps.transport.outputs.mode == 'cache' && steps.tooling-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ARTIFACT_ROOT: ${{ steps.transport.outputs.artifact-root }}
      run: |
        set -euo pipefail
        mkdir -p "$ARTIFACT_ROOT"
        cp -R "$GITHUB_WORKSPACE/tooling" "$ARTIFACT_ROOT/tooling"

    - name: Upload pinned production tooling artifact fallback
      if: steps.transport.outputs.mode == 'artifact' || steps.tooling-cache.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.transport.outputs.artifact-root }}
        retention-days: 1
        if-no-files-found: error
        overwrite: true
