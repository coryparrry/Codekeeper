name: Codekeeper tooling bootstrap
description: Stage the pinned production Codekeeper runtime as a short-lived workflow artifact.

inputs:
  artifact-name:
    description: Exact artifact name derived from the current workflow run and attempt.
    required: true

runs:
  using: composite
  steps:
    - name: Stage pinned production tooling
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        STAGING_ROOT: ${{ runner.temp }}/codekeeper-tooling
      run: |
        set -euo pipefail
        target="$STAGING_ROOT/tooling/tools/codekeeper"
        test ! -e "$STAGING_ROOT" || {
          echo "Codekeeper tooling bootstrap staging path already exists" >&2
          exit 1
        }
        mkdir -p "$target/scripts"
        for file in package.json package-lock.json tooling-manifest.json; do
          test -f "$ACTION_PATH/$file" && test ! -L "$ACTION_PATH/$file" || {
            echo "Codekeeper tooling bootstrap refused an invalid file: $file" >&2
            exit 1
          }
          cp "$ACTION_PATH/$file" "$target/$file"
        done
        test -f "$ACTION_PATH/scripts/verify-tooling-artifact.mjs" && test ! -L "$ACTION_PATH/scripts/verify-tooling-artifact.mjs" || {
          echo "Codekeeper tooling bootstrap refused an invalid verifier" >&2
          exit 1
        }
        cp "$ACTION_PATH/scripts/verify-tooling-artifact.mjs" "$target/scripts/verify-tooling-artifact.mjs"
        for directory in agents presets src; do
          test -d "$ACTION_PATH/$directory" && test ! -L "$ACTION_PATH/$directory" || {
            echo "Codekeeper tooling bootstrap refused an invalid directory: $directory" >&2
            exit 1
          }
          find "$ACTION_PATH/$directory" -type l -print -quit | grep -q . && {
            echo "Codekeeper tooling bootstrap refused a tooling symlink" >&2
            exit 1
          }
          find "$ACTION_PATH/$directory" -name '.*' -print -quit | grep -q . && {
            echo "Codekeeper tooling bootstrap refused a hidden tooling path" >&2
            exit 1
          }
          cp -R "$ACTION_PATH/$directory" "$target/$directory"
        done
        find "$target" -type l -print -quit | grep -q . && {
          echo "Codekeeper tooling bootstrap created a symlink" >&2
          exit 1
        }
        find "$target" -name '.*' -print -quit | grep -q . && {
          echo "Codekeeper tooling bootstrap created a hidden path" >&2
          exit 1
        }
    - name: Upload pinned production tooling
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/codekeeper-tooling
        retention-days: 1
        if-no-files-found: error
