name: Acquire exact Codekeeper package
description: Download, verify, and stage one exact Codekeeper npm release.

inputs:
  package_source:
    description: Use registry to download once or artifact to reverify staged bytes
    required: false
    default: registry
  package_version:
    description: Exact Codekeeper npm package version
    required: true
  package_integrity:
    description: Exact sha512 integrity for the Codekeeper npm tarball
    required: true
  expected_manifest_sha256:
    description: Expected release-manifest SHA-256 when reverifying an artifact
    required: false
  expected_source_commit:
    description: Expected source commit when reverifying an artifact
    required: false

outputs:
  package_manifest_sha256:
    description: SHA-256 of the verified package release manifest
    value: ${{ steps.acquire.outputs.package_manifest_sha256 }}
  source_commit:
    description: Source commit declared by the verified package
    value: ${{ steps.acquire.outputs.source_commit }}

runs:
  using: composite
  steps:
    - name: Download, verify, and stage the exact package
      id: acquire
      shell: bash
      env:
        CODEKEEPER_PACKAGE_SOURCE: ${{ inputs.package_source }}
        CODEKEEPER_PACKAGE_VERSION: ${{ inputs.package_version }}
        CODEKEEPER_PACKAGE_INTEGRITY: ${{ inputs.package_integrity }}
        CODEKEEPER_EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        CODEKEEPER_EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_IGNORE_SCRIPTS: "true"
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        NPM_CONFIG_UPDATE_NOTIFIER: "false"
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/codekeeper-empty-npmrc
      run: |
        set -euo pipefail
        download_root="$RUNNER_TEMP/codekeeper-package-download"
        install_root="$RUNNER_TEMP/codekeeper-package-install"
        tooling_root="$GITHUB_WORKSPACE/tooling/tools/codekeeper"
        if [[ "$CODEKEEPER_PACKAGE_SOURCE" == "registry" ]]; then
          for target in "$download_root" "$install_root" "$GITHUB_WORKSPACE/tooling"; do
            if test -e "$target"; then
              echo "Codekeeper package acquisition path already exists: $target" >&2
              exit 1
            fi
          done
          mkdir -p "$download_root"
          : > "$NPM_CONFIG_USERCONFIG"
          report="$download_root/npm-pack.json"
          (
            cd "$download_root"
            npm pack --json --ignore-scripts --pack-destination "$download_root" "@coryparry/codekeeper@$CODEKEEPER_PACKAGE_VERSION" > "$report"
          )

          # JavaScript template literals are intentionally single-quoted from Bash.
          # shellcheck disable=SC2016
          tarball_path="$RUNNER_TEMP/codekeeper-package-tarball.txt"
          REPORT="$report" DOWNLOAD_ROOT="$download_root" TARBALL_PATH="$tarball_path" node --input-type=module -e '
          import { createHash } from "node:crypto";
          import { readFileSync, realpathSync, statSync, writeFileSync } from "node:fs";
          import { basename, join, relative } from "node:path";
          const version = process.env.CODEKEEPER_PACKAGE_VERSION;
          const integrity = process.env.CODEKEEPER_PACKAGE_INTEGRITY;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) throw new Error("Invalid Codekeeper package version");
          if (!/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(integrity)) throw new Error("Invalid Codekeeper package integrity");
          const parsed = JSON.parse(readFileSync(process.env.REPORT, "utf8"));
          const report = Array.isArray(parsed) ? parsed : Object.values(parsed ?? {});
          if (report.length !== 1) throw new Error("npm pack returned an invalid report");
          const entry = report[0];
          if (entry?.name !== "@coryparry/codekeeper" || entry.version !== version || entry.integrity !== integrity) throw new Error("npm pack did not return the exact Codekeeper release");
          if (typeof entry.filename !== "string" || basename(entry.filename) !== entry.filename || !entry.filename.endsWith(".tgz")) throw new Error("npm pack returned an unsafe filename");
          const root = realpathSync(process.env.DOWNLOAD_ROOT);
          const tarball = realpathSync(join(root, entry.filename));
          if (relative(root, tarball).startsWith("..") || !statSync(tarball).isFile()) throw new Error("Codekeeper package tarball escaped its staging directory");
          const actualIntegrity = `sha512-${createHash("sha512").update(readFileSync(tarball)).digest("base64")}`;
          if (actualIntegrity !== integrity) throw new Error("Codekeeper package tarball integrity mismatch");
          writeFileSync(process.env.TARBALL_PATH, `${tarball}\n`, { flag: "wx" });
          '
          CODEKEEPER_TARBALL="$(sed -n '1p' "$tarball_path")"
          export CODEKEEPER_TARBALL

          tar -tzf "$CODEKEEPER_TARBALL" > "$RUNNER_TEMP/codekeeper-package-names.txt"
          tar -tvzf "$CODEKEEPER_TARBALL" > "$RUNNER_TEMP/codekeeper-package-types.txt"
          ARCHIVE_NAMES="$RUNNER_TEMP/codekeeper-package-names.txt" ARCHIVE_TYPES="$RUNNER_TEMP/codekeeper-package-types.txt" node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const names = readFileSync(process.env.ARCHIVE_NAMES, "utf8").split("\n").filter(Boolean);
          const types = readFileSync(process.env.ARCHIVE_TYPES, "utf8").split("\n").filter(Boolean);
          if (!names.length || names.length !== new Set(names).size) throw new Error("Codekeeper package archive inventory is invalid");
          for (const name of names) {
            const parts = name.split("/");
            if (!name.startsWith("package/") || name.startsWith("/") || name.includes("\\") || parts.some((part) => part === "." || part === ".." || part.startsWith("."))) {
              throw new Error("Codekeeper package archive contains an unsafe path");
            }
          }
          if (types.length !== names.length || types.some((line) => !new Set(["-", "d"]).has(line[0]))) {
            throw new Error("Codekeeper package archive contains a link or unsupported entry");
          }
          '
          mkdir -p "$install_root"
          tar -xzf "$CODEKEEPER_TARBALL" --strip-components=1 --no-same-owner --no-same-permissions -C "$install_root"
          mkdir -p "$(dirname "$tooling_root")"
          cp -R "$install_root" "$tooling_root"
        elif [[ "$CODEKEEPER_PACKAGE_SOURCE" == "artifact" ]]; then
          test -d "$tooling_root" || { echo "Downloaded Codekeeper package is missing" >&2; exit 1; }
        else
          echo "Invalid Codekeeper package source" >&2
          exit 1
        fi

        result_path="$RUNNER_TEMP/codekeeper-package-result.txt"
        TOOLING_ROOT="$tooling_root" RESULT_PATH="$result_path" node --input-type=module -e '
          import { createHash } from "node:crypto";
          import { lstat, mkdir, readFile, writeFile } from "node:fs/promises";
          import { dirname, join } from "node:path";
          const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const regular = async (file, label) => {
            const stat = await lstat(file);
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`Codekeeper package acquisition rejected ${label}`);
            return readFile(file);
          };
          const manifestBytes = await regular(join(process.env.TOOLING_ROOT, "release", "manifest.json"), "release manifest");
          const manifestSha256 = digest(manifestBytes);
          const manifest = JSON.parse(manifestBytes);
          if (manifest?.package?.name !== "@coryparry/codekeeper" || manifest.package.version !== process.env.CODEKEEPER_PACKAGE_VERSION || manifest?.source?.repository !== "https://github.com/coryparrry/Codekeeper" || !/^[0-9a-f]{40}$/.test(manifest?.source?.commit ?? "")) throw new Error("Codekeeper package manifest identity mismatch");
          if (process.env.CODEKEEPER_PACKAGE_SOURCE === "artifact") {
            if (!/^[0-9a-f]{64}$/.test(process.env.CODEKEEPER_EXPECTED_MANIFEST_SHA256 ?? "") || manifestSha256 !== process.env.CODEKEEPER_EXPECTED_MANIFEST_SHA256) throw new Error("Codekeeper package manifest digest mismatch");
            if (!/^[0-9a-f]{40}$/.test(process.env.CODEKEEPER_EXPECTED_SOURCE_COMMIT ?? "") || manifest.source.commit !== process.env.CODEKEEPER_EXPECTED_SOURCE_COMMIT) throw new Error("Codekeeper package source commit mismatch");
          }
          const verifier = Array.isArray(manifest.files) && manifest.files.find((entry) => entry?.path === "bin/verify-package.mjs");
          if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256 ?? "")) throw new Error("Codekeeper package manifest lacks its verifier");
          const verifierBytes = await regular(join(process.env.TOOLING_ROOT, "bin", "verify-package.mjs"), "package verifier");
          if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper package verifier digest mismatch");
          const receiptPath = join(process.env.TOOLING_ROOT, "release", "package-integrity.json");
          if (process.env.CODEKEEPER_PACKAGE_SOURCE === "registry") {
            const receipt = { version: 1, algorithm: "sha512", integrity: process.env.CODEKEEPER_PACKAGE_INTEGRITY };
            await mkdir(dirname(receiptPath), { recursive: true });
            await writeFile(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`, { flag: "wx" });
          } else {
            await regular(receiptPath, "package integrity receipt");
          }
          await writeFile(process.env.RESULT_PATH, `${manifestSha256}\n${manifest.source.commit}\n`, { flag: "wx" });
        '
        package_manifest_sha256="$(sed -n '1p' "$result_path")"
        source_commit="$(sed -n '2p' "$result_path")"
        node "$tooling_root/bin/verify-package.mjs" \
          --root "$tooling_root" \
          --expected-name "@coryparry/codekeeper" \
          --expected-version "$CODEKEEPER_PACKAGE_VERSION" \
          --expected-integrity "$CODEKEEPER_PACKAGE_INTEGRITY" \
          --expected-manifest-sha256 "$package_manifest_sha256" \
          --expected-source-commit "$source_commit"
        printf 'package_manifest_sha256=%s\nsource_commit=%s\n' \
          "$package_manifest_sha256" "$source_commit" >> "$GITHUB_OUTPUT"
