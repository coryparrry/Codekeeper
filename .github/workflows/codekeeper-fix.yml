name: Codekeeper bounded implementation and repair

# GitHub.com only: this reusable workflow relies on job.workflow_sha.
on:
  workflow_call:
    inputs:
      enabled:
        required: false
        default: true
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login that may authorize ready-label implementation.
        required: false
        default: ""
        type: string
      issue_number:
        description: Issue or pull request number for a workflow_dispatch caller.
        required: false
        default: ""
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
      app_client_id:
        description: GitHub App client ID. Required only when dry_run=false.
        required: false
        default: ""
        type: string
    secrets:
      model_api_key:
        description: API key for the provider selected by ai.agents.fix.provider.
        required: true
      workspace_api_key:
        description: OpenAI API key for the optional Codex workspace specialist.
        required: false
      openai_api_key:
        description: Deprecated compatibility fallback for the Codex workspace specialist only.
        required: false
      trace_api_key:
        description: Dedicated OpenAI API key used only to export required Agents SDK traces.
        required: false
      app_private_key:
        description: GitHub App private key. Required only when dry_run=false.
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CODEKEEPER_TOOLING_MANIFEST_SHA256: 7484aefce11929cb70a20e40836a6dd3ca1069d178dc3b99703bce13bcce4958

concurrency:
  group: codekeeper-fix-${{ inputs.issue_number || github.event.issue.number || github.event.client_payload.number }}
  cancel-in-progress: false

jobs:
  workspace:
    name: Codekeeper implementation workspace specialist
    if: >-
      inputs.enabled &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'codekeeper_fix' &&
       github.actor == inputs.automation_bot_login) ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'codekeeper:ready' &&
       github.event.sender.login == inputs.automation_bot_login))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
      base_sha: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
      target_kind: ${{ fromJSON(steps.prepare.outputs.result).target.kind }}
    steps:
      - name: Resolve authorised repair target
        id: target
        env:
          MANUAL_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number || github.event.client_payload.number }}
        run: |
          target="${MANUAL_ISSUE:-$EVENT_ISSUE}"
          [[ "$target" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue or pull request number"; exit 1; }
          echo "target_number=$target" >> "$GITHUB_OUTPUT"
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Prepare runner-owned fixer bundle
        id: prepare
        working-directory: repository
        env:
          CODEKEEPER_TOOLING_SHA: ${{ job.workflow_sha }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/fixer.md
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ steps.target.outputs.target_number }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by || github.actor }}
          AUTHORIZATION_MODE: ${{ github.event.client_payload.authorization_mode || (github.event_name == 'issues' && 'policy') || 'owner' }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head_sha || '' }}
          REVIEW_THREAD_IDS: ${{ toJSON(github.event.client_payload.review_thread_ids || fromJSON('[]')) }}
        run: |
          cp "$SOURCE_CONFIG" "$CONFIG"
          [[ "$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).repository.defaultBranch)' "$CONFIG")" == "$DEFAULT_BRANCH" ]] || {
            echo "Configured default branch does not match the repository default branch"
            exit 1
          }
          node ../tooling/tools/codekeeper/src/cli.mjs prepare-fix \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --target-number "$TARGET_NUMBER" \
            --actor "$REQUESTED_BY" \
            --authorization-mode "$AUTHORIZATION_MODE" \
            --expected-head "$EXPECTED_HEAD" \
            --review-thread-ids "$REVIEW_THREAD_IDS" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$(git rev-parse HEAD)" \
            --tooling-sha "$CODEKEEPER_TOOLING_SHA"
          echo "context_sha256=$(sha256sum "$BUNDLE/context.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Check out frozen repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Resolve fix agent settings
        id: settings
        working-directory: repository
        env:
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs agent-settings \
            --config "$CONFIG" \
            --mode fix
      - name: Require optional workspace specialist key
        if: steps.settings.outputs.workspace_enabled == 'true'
        env:
          WORKSPACE_API_KEY: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
        run: |
          test -n "$WORKSPACE_API_KEY" || {
            echo "workspace_api_key is required because ai.agents.fix.workspace.enabled=true"
            exit 1
          }
      - name: Isolate Codex from repository instruction surfaces
        if: steps.settings.outputs.workspace_enabled == 'true'
        working-directory: repository
        env:
          CODEX_HOME: ${{ runner.temp }}/codekeeper-codex-home
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
          REPOSITORY_PATH: ${{ github.workspace }}/repository
        run: |
          test ! -e "$CODEX_HOME" || { echo "Isolated Codex home already exists"; exit 1; }
          test ! -e "$QUARANTINE" || { echo "Repository skill quarantine already exists"; exit 1; }
          test ! -L .agents || { echo "Refusing symlinked .agents instruction root"; exit 1; }
          test ! -L .codex || { echo "Refusing symlinked .codex instruction root"; exit 1; }
          install -d -m 700 "$CODEX_HOME" "$QUARANTINE"
          {
            echo 'project_doc_max_bytes = 0'
            echo 'project_doc_fallback_filenames = []'
            echo
            echo '[skills]'
            echo 'include_instructions = false'
            echo 'bundled = { enabled = false }'
            echo
            printf '[projects.%s]\n' "$(node -p 'JSON.stringify(process.env.REPOSITORY_PATH)')"
            echo 'trust_level = "untrusted"'
          } > "$CODEX_HOME/config.toml"
          for surface in .agents/skills .codex/skills; do
            if [ -e "$surface" ] || [ -L "$surface" ]; then
              mkdir -p "$QUARANTINE/$(dirname "$surface")"
              mv -- "$surface" "$QUARANTINE/$surface"
            fi
          done
      - name: Implement with optional Codex specialist
        if: steps.settings.outputs.workspace_enabled == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
          codex-home: ${{ runner.temp }}/codekeeper-codex-home
          codex-version: 0.146.0
          model: ${{ steps.settings.outputs.workspace_model }}
          effort: ${{ steps.settings.outputs.workspace_effort }}
          sandbox: ${{ steps.settings.outputs.workspace_sandbox }}
          safety-strategy: drop-sudo
          allow-users: ${{ github.actor }}
          working-directory: repository
          prompt-file: ${{ runner.temp }}/codekeeper-bundle/workspace-prompt.md
          output-file: ${{ runner.temp }}/codekeeper-bundle/workspace-result.json
          output-schema-file: ${{ runner.temp }}/codekeeper-bundle/schema.json
      - name: Restore quarantined repository skills
        if: always() && steps.settings.outputs.workspace_enabled == 'true'
        working-directory: repository
        env:
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
        run: |
          contaminated=false
          for surface in .agents/skills .codex/skills; do
            if [ -e "$surface" ] || [ -L "$surface" ]; then
              mkdir -p "$QUARANTINE/generated/$(dirname "$surface")"
              mv -- "$surface" "$QUARANTINE/generated/$surface"
              contaminated=true
            fi
            if [ -e "$QUARANTINE/$surface" ] || [ -L "$QUARANTINE/$surface" ]; then
              mkdir -p "$(dirname "$surface")"
              mv -- "$QUARANTINE/$surface" "$surface"
            fi
          done
          [ "$contaminated" = false ] || { echo "Codex created a quarantined instruction surface"; exit 1; }
      - name: Capture untrusted workspace patch
        working-directory: repository
        env:
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs capture-workspace-patch \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --patch "$BUNDLE/workspace.patch"
      - name: Upload untrusted workspace evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-fix-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-bundle
          retention-days: 1
          if-no-files-found: error

  analyze:
    name: Codekeeper implementation analysis
    needs: workspace
    if: needs.workspace.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      candidate_sha256: ${{ steps.validate.outputs.candidate_sha256 }}
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
      base_sha: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
      target_kind: ${{ fromJSON(steps.prepare.outputs.result).target.kind }}
    steps:
      - name: Resolve authorised repair target
        id: target
        env:
          MANUAL_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number || github.event.client_payload.number }}
        run: |
          target="${MANUAL_ISSUE:-$EVENT_ISSUE}"
          [[ "$target" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue or pull request number"; exit 1; }
          echo "target_number=$target" >> "$GITHUB_OUTPUT"
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned Agents SDK runtime
        working-directory: tooling/tools/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download untrusted workspace evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-workspace
      - name: Prepare runner-owned implementation bundle
        id: prepare
        working-directory: repository
        env:
          CODEKEEPER_TOOLING_SHA: ${{ job.workflow_sha }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          WORKSPACE: ${{ runner.temp }}/codekeeper-workspace
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/fixer.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ steps.target.outputs.target_number }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by || github.actor }}
          AUTHORIZATION_MODE: ${{ github.event.client_payload.authorization_mode || (github.event_name == 'issues' && 'policy') || 'owner' }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head_sha || '' }}
          REVIEW_THREAD_IDS: ${{ toJSON(github.event.client_payload.review_thread_ids || fromJSON('[]')) }}
        run: |
          [[ ! -e "$CONFIG" ]] || { echo "Frozen config already exists"; exit 1; }
          cp "$SOURCE_CONFIG" "$CONFIG"
          [[ "$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).repository.defaultBranch)' "$CONFIG")" == "$DEFAULT_BRANCH" ]] || {
            echo "Configured default branch does not match the repository default branch"
            exit 1
          }
          node ../tooling/tools/codekeeper/src/cli.mjs prepare-fix \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --target-number "$TARGET_NUMBER" \
            --actor "$REQUESTED_BY" \
            --authorization-mode "$AUTHORIZATION_MODE" \
            --expected-head "$EXPECTED_HEAD" \
            --review-thread-ids "$REVIEW_THREAD_IDS" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$(git rev-parse HEAD)" \
            --tooling-sha "$CODEKEEPER_TOOLING_SHA"
          {
            echo "context_sha256=$(sha256sum "$BUNDLE/context.json" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: Check out frozen repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Bind workspace evidence to frozen context
        env:
          WORKSPACE_CONTEXT_SHA256: ${{ needs.workspace.outputs.context_sha256 }}
          COORDINATOR_CONTEXT_SHA256: ${{ steps.prepare.outputs.context_sha256 }}
          WORKSPACE_BASE_SHA: ${{ needs.workspace.outputs.base_sha }}
          COORDINATOR_BASE_SHA: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
        run: |
          test -n "$WORKSPACE_CONTEXT_SHA256" || { echo "Workspace context digest is missing"; exit 1; }
          test -n "$COORDINATOR_CONTEXT_SHA256" || { echo "Coordinator context digest is missing"; exit 1; }
          [[ "$WORKSPACE_CONTEXT_SHA256" == "$COORDINATOR_CONTEXT_SHA256" ]] || {
            echo "Workspace evidence does not match the frozen coordinator context"
            exit 1
          }
          [[ "$WORKSPACE_BASE_SHA" == "$COORDINATOR_BASE_SHA" ]] || {
            echo "Workspace checkout does not match the frozen coordinator target"
            exit 1
          }
      - name: Finalize implementation result with configured Agents SDK model
        working-directory: repository
        env:
          CODEKEEPER_MODEL_API_KEY: ${{ secrets.model_api_key }}
          CODEKEEPER_TRACE_API_KEY: ${{ secrets.trace_api_key }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          WORKSPACE: ${{ runner.temp }}/codekeeper-workspace
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs run-agent \
            --config "$CONFIG" \
            --mode fix \
            --directory "$BUNDLE" \
            --workspace-result "$WORKSPACE/workspace-result.json" \
            --result "$BUNDLE/agent-result.json"
      - name: Apply untrusted workspace patch
        working-directory: repository
        env:
          WORKSPACE: ${{ runner.temp }}/codekeeper-workspace
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs apply-workspace-patch \
            --patch "$WORKSPACE/workspace.patch"
      - name: Capture untrusted implementation candidate
        id: validate
        working-directory: repository
        env:
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          TARGET_NUMBER: ${{ steps.target.outputs.target_number }}
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs validate-fix \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --context "$BUNDLE/context.json" \
            --result "$BUNDLE/agent-result.json" \
            --artifact "$CANDIDATE" \
            --target-number "$TARGET_NUMBER"
      - name: Upload untrusted implementation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-fix-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-candidate
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Codekeeper implementation verification
    needs: analyze
    if: needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"
      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: policy
          persist-credentials: false
      - name: Check out frozen repair target for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.base_sha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Download untrusted implementation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-candidate
      - name: Verify candidate without OpenAI or App credentials
        working-directory: repository
        env:
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          CANDIDATE_SHA256: ${{ needs.analyze.outputs.candidate_sha256 }}
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs verify-fix \
            --config "$CONFIG" \
            --candidate "$CANDIDATE" \
            --expected-candidate-sha "$CANDIDATE_SHA256"

  seal:
    needs: [analyze, verify]
    if: needs.analyze.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    steps:
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"
      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Download untrusted implementation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-candidate
      - name: Seal implementation artifact without repository execution
        id: seal
        env:
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          ARTIFACT: ${{ runner.temp }}/codekeeper-artifact
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          CANDIDATE_SHA256: ${{ needs.analyze.outputs.candidate_sha256 }}
          CONTEXT_SHA256: ${{ needs.analyze.outputs.context_sha256 }}
        run: |
          node tooling/tools/codekeeper/src/cli.mjs seal-fix \
            --config "$CONFIG" \
            --candidate "$CANDIDATE" \
            --artifact "$ARTIFACT" \
            --expected-candidate-sha "$CANDIDATE_SHA256" \
            --expected-context-sha "$CONTEXT_SHA256"
      - name: Upload sealed implementation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-fix-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-artifact
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [analyze, seal]
    if: needs.seal.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require GitHub App publication credentials
        env:
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: |
          test -n "$APP_CLIENT_ID" || { echo "app_client_id is required when dry_run=false"; exit 1; }
          test -n "$APP_PRIVATE_KEY" || { echo "app_private_key is required when dry_run=false"; exit 1; }
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Resolve immutable automation bot identity
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          identity="$(curl --globoff --fail-with-body --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/users/${APP_SLUG}[bot]")"
          echo "login=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).login))')" >> "$GITHUB_OUTPUT"
          echo "id=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).id))')" >> "$GITHUB_OUTPUT"
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"
      - name: Check out current trusted policy without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: policy
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Check out frozen repair target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.base_sha }}
          fetch-depth: 0
          path: repository
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Download sealed implementation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-artifact
      - name: Publish sealed owner-commanded repair
        working-directory: repository
        env:
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ steps.bot.outputs.login }}
          CODEKEEPER_AUTOMATION_BOT_ID: ${{ steps.bot.outputs.id }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          AGENT_PROFILE: ${{ github.workspace }}/policy/.github/codekeeper/agents/fixer.md
          MANIFEST_SHA256: ${{ needs.seal.outputs.manifest_sha256 }}
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs publish-fix \
            --config "$CONFIG" \
            --agent-profile "$AGENT_PROFILE" \
            --artifact "$RUNNER_TEMP/codekeeper-artifact" \
            --expected-manifest-sha "$MANIFEST_SHA256"
