name: Codekeeper bounded implementation and repair

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      enabled:
        required: false
        default: true
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login that may authorize ready-label implementation.
        required: false
        default: ""
        type: string
      issue_number:
        description: Issue or pull request number for a workflow_dispatch caller.
        required: false
        default: ""
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
      app_client_id:
        description: GitHub App client ID. Required only when dry_run=false.
        required: false
        default: ""
        type: string
      app_contents_permission:
        description: GitHub App Contents permission requested by this workflow.
        required: false
        default: write
        type: string
      app_issues_permission:
        description: GitHub App Issues permission requested by this workflow.
        required: false
        default: write
        type: string
      app_pull_requests_permission:
        description: GitHub App Pull requests permission requested by this workflow.
        required: false
        default: write
        type: string
    secrets:
      model_api_key:
        description: API key for the provider selected by ai.agents.fix.provider.
        required: true
      workspace_api_key:
        description: OpenAI API key for the optional Codex workspace specialist.
        required: false
      openai_api_key:
        description: Deprecated compatibility fallback for the Codex workspace specialist only.
        required: false
      trace_api_key:
        description: Dedicated OpenAI API key used only to export required Agents SDK traces.
        required: false
      app_private_key:
        description: GitHub App private key. Required only when dry_run=false.
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CODEKEEPER_PACKAGE_NAME: codekeeper
  CODEKEEPER_PACKAGE_VERSION: ${{ inputs.package_version }}
  CODEKEEPER_PACKAGE_INTEGRITY: ${{ inputs.package_integrity }}

concurrency:
  group: codekeeper-fix-${{ inputs.issue_number || github.event.issue.number || github.event.client_payload.number }}
  cancel-in-progress: false

jobs:
  workspace:
    name: Codekeeper implementation workspace specialist
    if: >-
      inputs.enabled &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'codekeeper_fix' &&
       github.actor == inputs.automation_bot_login) ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'codekeeper:ready' &&
       github.event.sender.login == inputs.automation_bot_login))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
      base_sha: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
      repository_sha: ${{ steps.repository-source.outputs.sha }}
      target_kind: ${{ fromJSON(steps.prepare.outputs.result).target.kind }}
      package_manifest_sha256: ${{ steps.codekeeper-package.outputs.package_manifest_sha256 }}
      package_source_commit: ${{ steps.codekeeper-package.outputs.source_commit }}
    steps:
      - name: Resolve authorised repair target
        id: target
        env:
          MANUAL_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number || github.event.client_payload.number }}
        run: |
          target="${MANUAL_ISSUE:-$EVENT_ISSUE}"
          [[ "$target" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue or pull request number"; exit 1; }
          echo "target_number=$target" >> "$GITHUB_OUTPUT"
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Record trusted repository source
        id: repository-source
        working-directory: repository
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Acquire exact Codekeeper package
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}

      - name: Upload verified Codekeeper package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}/tooling
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"
      - name: Prepare runner-owned fixer bundle
        id: prepare
        working-directory: repository
        env:
          CODEKEEPER_TOOLING_SHA: ${{ steps.codekeeper-package.outputs.source_commit }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ github.workspace }}/codekeeper-mode-plan/plan.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/fixer.md
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ steps.target.outputs.target_number }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by || github.actor }}
          AUTHORIZATION_MODE: ${{ github.event.client_payload.authorization_mode || (github.event_name == 'issues' && 'policy') || 'owner' }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head_sha || '' }}
          REVIEW_THREAD_IDS: ${{ toJSON(github.event.client_payload.review_thread_ids || fromJSON('[]')) }}
        run: |
          mkdir -p "$(dirname "$MODE_PLAN")"
          node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode fix --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --policy-config "$SOURCE_CONFIG" --ready-label-fix true \
            --target-number "${{ inputs.issue_number || github.event.issue.number || github.event.client_payload.number }}" \
            --dry-run-value "${{ inputs.dry_run }}" > "$MODE_PLAN"
          node ../tooling/codekeeper-runtime/src/cli.mjs stage compute --operation prepare --mode fix \
            --config "$CONFIG" \
            --source-config "$SOURCE_CONFIG" \
            --default-branch "$DEFAULT_BRANCH" \
            --mode-plan "$MODE_PLAN" \
            --directory "$BUNDLE" \
            --target-number "$TARGET_NUMBER" \
            --actor "$REQUESTED_BY" \
            --authorization-mode "$AUTHORIZATION_MODE" \
            --expected-head "$EXPECTED_HEAD" \
            --review-thread-ids "$REVIEW_THREAD_IDS" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$(git rev-parse HEAD)" \
            --tooling-sha "$CODEKEEPER_TOOLING_SHA"
      - name: Check out frozen repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Run fix workspace stage
        working-directory: repository
        env:
          CODEKEEPER_WORKSPACE_API_KEY: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CODEX_HOME: ${{ github.workspace }}/codekeeper-codex-home
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ github.workspace }}/codekeeper-mode-plan/plan.json
        run: |
          node ../tooling/codekeeper-runtime/src/cli.mjs stage compute --operation workspace --mode fix \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --mode-plan "$MODE_PLAN" \
            --mutation-authorized true \
            --patch "$BUNDLE/workspace.patch" \
            --result "$BUNDLE/workspace-result.json"
      - name: Upload untrusted workspace evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-fix-workspace-${{ github.run_id }}
          path: ${{ github.workspace }}/codekeeper-bundle
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  analyze:
    name: Codekeeper implementation analysis
    needs: workspace
    if: needs.workspace.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      candidate_sha256: ${{ steps.validate.outputs.candidate_sha256 }}
      handoff_manifest_sha256: ${{ steps.validate.outputs.handoff_manifest_sha256 }}
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
      base_sha: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
      target_kind: ${{ fromJSON(steps.prepare.outputs.result).target.kind }}
    steps:
      - name: Download verified Codekeeper package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}/tooling
      - name: Resolve authorised repair target
        id: target
        env:
          MANUAL_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number || github.event.client_payload.number }}
        run: |
          target="${MANUAL_ISSUE:-$EVENT_ISSUE}"
          [[ "$target" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue or pull request number"; exit 1; }
          echo "target_number=$target" >> "$GITHUB_OUTPUT"
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.workspace.outputs.repository_sha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify downloaded Codekeeper package
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_source: artifact
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}
          expected_manifest_sha256: ${{ needs.workspace.outputs.package_manifest_sha256 }}
          expected_source_commit: ${{ needs.workspace.outputs.package_source_commit }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"
      - name: Download untrusted workspace evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-workspace-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-workspace
      - name: Prepare runner-owned implementation bundle
        id: prepare
        working-directory: repository
        env:
          CODEKEEPER_TOOLING_SHA: ${{ needs.workspace.outputs.package_source_commit }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          WORKSPACE: ${{ runner.temp }}/codekeeper-workspace
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/fixer.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_NUMBER: ${{ steps.target.outputs.target_number }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by || github.actor }}
          AUTHORIZATION_MODE: ${{ github.event.client_payload.authorization_mode || (github.event_name == 'issues' && 'policy') || 'owner' }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head_sha || '' }}
          REVIEW_THREAD_IDS: ${{ toJSON(github.event.client_payload.review_thread_ids || fromJSON('[]')) }}
        run: |
          mkdir -p "$(dirname "$MODE_PLAN")"
          node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode fix --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --policy-config "$SOURCE_CONFIG" --ready-label-fix true \
            --target-number "${{ inputs.issue_number || github.event.issue.number || github.event.client_payload.number }}" \
            --dry-run-value "${{ inputs.dry_run }}" > "$MODE_PLAN"
          node ../tooling/codekeeper-runtime/src/cli.mjs stage compute --operation prepare --mode fix \
            --config "$CONFIG" \
            --source-config "$SOURCE_CONFIG" \
            --default-branch "$DEFAULT_BRANCH" \
            --mode-plan "$MODE_PLAN" \
            --directory "$BUNDLE" \
            --target-number "$TARGET_NUMBER" \
            --actor "$REQUESTED_BY" \
            --authorization-mode "$AUTHORIZATION_MODE" \
            --expected-head "$EXPECTED_HEAD" \
            --review-thread-ids "$REVIEW_THREAD_IDS" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$(git rev-parse HEAD)" \
            --tooling-sha "$CODEKEEPER_TOOLING_SHA"
      - name: Check out frozen repair target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.prepare.outputs.result).baseSha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Finalize implementation result with configured Agents SDK model
        working-directory: repository
        env:
          CODEKEEPER_MODEL_API_KEY: ${{ secrets.model_api_key }}
          CODEKEEPER_TRACE_API_KEY: ${{ secrets.trace_api_key }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          WORKSPACE: ${{ runner.temp }}/codekeeper-workspace
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
        run: |
          node ../tooling/codekeeper-runtime/src/cli.mjs stage compute --operation analyze --mode fix \
            --config "$CONFIG" \
            --mode-plan "$MODE_PLAN" \
            --mode fix \
            --directory "$BUNDLE" \
            --workspace-result "$WORKSPACE/workspace-result.json" \
            --expected-context-sha "${{ needs.workspace.outputs.context_sha256 }}" \
            --expected-base-sha "${{ needs.workspace.outputs.base_sha }}" \
            --workspace-patch "$WORKSPACE/workspace.patch" \
            --result "$BUNDLE/agent-result.json"
      - name: Capture untrusted implementation candidate
        id: validate
        working-directory: repository
        env:
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          WORKSPACE: ${{ runner.temp }}/codekeeper-workspace
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          TARGET_NUMBER: ${{ steps.target.outputs.target_number }}
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
        run: |
          node ../tooling/codekeeper-runtime/src/cli.mjs stage validate --operation candidate --mode fix \
            --config "$CONFIG" \
            --mode-plan "$MODE_PLAN" \
            --directory "$BUNDLE" \
            --context "$BUNDLE/context.json" \
            --result "$BUNDLE/agent-result.json" \
            --workspace-result "$WORKSPACE/workspace-result.json" \
            --artifact "$CANDIDATE" \
            --tooling-sha "${{ steps.codekeeper-package.outputs.source_commit }}" \
            --target-number "$TARGET_NUMBER"
      - name: Upload untrusted implementation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-fix-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  verify:
    name: Codekeeper implementation verification
    needs: [workspace, analyze]
    if: needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      handoff_manifest_sha256: ${{ steps.verify-stage.outputs.handoff_manifest_sha256 }}
    steps:
      - name: Download verified Codekeeper package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}/tooling
      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: policy
          persist-credentials: false
      - name: Check out frozen repair target for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.base_sha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify downloaded Codekeeper package
        id: codekeeper-package
        uses: ./policy/.github/codekeeper/actions/acquire-package
        with:
          package_source: artifact
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}
          expected_manifest_sha256: ${{ needs.workspace.outputs.package_manifest_sha256 }}
          expected_source_commit: ${{ needs.workspace.outputs.package_source_commit }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"
      - name: Download untrusted implementation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate
      - name: Verify candidate without OpenAI or App credentials
        id: verify-stage
        working-directory: repository
        env:
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          CANDIDATE_SHA256: ${{ needs.analyze.outputs.candidate_sha256 }}
          HANDOFF_MANIFEST_SHA256: ${{ needs.analyze.outputs.handoff_manifest_sha256 }}
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
        run: |
          mkdir -p "$(dirname "$MODE_PLAN")"
          node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode fix --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --policy-config "$CONFIG" --ready-label-fix true \
            --target-number "${{ inputs.issue_number || github.event.issue.number || github.event.client_payload.number }}" \
            --dry-run-value "${{ inputs.dry_run }}" > "$MODE_PLAN"
          node ../tooling/codekeeper-runtime/src/cli.mjs stage validate --operation verify --mode fix \
            --config "$CONFIG" \
            --mode-plan "$MODE_PLAN" \
            --candidate "$CANDIDATE" \
            --expected-candidate-sha "$CANDIDATE_SHA256" \
            --tooling-sha "${{ steps.codekeeper-package.outputs.source_commit }}" \
            --expected-handoff-manifest-sha "$HANDOFF_MANIFEST_SHA256"
      - name: Upload implementation validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-fix-validation-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codekeeper-candidate/validation-receipt.json
            ${{ runner.temp }}/codekeeper-candidate/envelope.json
            ${{ runner.temp }}/codekeeper-candidate/handoff.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  seal:
    needs: [workspace, analyze, verify]
    if: needs.analyze.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    steps:
      - name: Download verified Codekeeper package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}/tooling
      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify downloaded Codekeeper package
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_source: artifact
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}
          expected_manifest_sha256: ${{ needs.workspace.outputs.package_manifest_sha256 }}
          expected_source_commit: ${{ needs.workspace.outputs.package_source_commit }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"
      - name: Download untrusted implementation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate
      - name: Download implementation validation receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-validation-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate
      - name: Seal implementation artifact without repository execution
        id: seal
        env:
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          ARTIFACT: ${{ runner.temp }}/codekeeper-artifact
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          CANDIDATE_SHA256: ${{ needs.analyze.outputs.candidate_sha256 }}
          CONTEXT_SHA256: ${{ needs.analyze.outputs.context_sha256 }}
          HANDOFF_MANIFEST_SHA256: ${{ needs.verify.outputs.handoff_manifest_sha256 }}
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
        run: |
          mkdir -p "$(dirname "$MODE_PLAN")"
          node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode fix --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --policy-config "$CONFIG" --ready-label-fix true \
            --target-number "${{ inputs.issue_number || github.event.issue.number || github.event.client_payload.number }}" \
            --dry-run-value "${{ inputs.dry_run }}" > "$MODE_PLAN"
          node tooling/codekeeper-runtime/src/cli.mjs stage validate --operation seal --mode fix \
            --config "$CONFIG" \
            --mode-plan "$MODE_PLAN" \
            --candidate "$CANDIDATE" \
            --artifact "$ARTIFACT" \
            --expected-candidate-sha "$CANDIDATE_SHA256" \
            --expected-context-sha "$CONTEXT_SHA256" \
            --tooling-sha "${{ steps.codekeeper-package.outputs.source_commit }}" \
            --expected-handoff-manifest-sha "$HANDOFF_MANIFEST_SHA256"
      - name: Upload sealed implementation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-fix-artifact-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-artifact
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [workspace, analyze, seal]
    if: needs.seal.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download verified Codekeeper package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}/tooling
      - name: Check out current trusted policy without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: policy
          persist-credentials: false
      - name: Check out frozen repair target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.base_sha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify downloaded Codekeeper package
        id: codekeeper-package
        uses: ./policy/.github/codekeeper/actions/acquire-package
        with:
          package_source: artifact
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}
          expected_manifest_sha256: ${{ needs.workspace.outputs.package_manifest_sha256 }}
          expected_source_commit: ${{ needs.workspace.outputs.package_source_commit }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"
      - name: Validate live publication preconditions through the mode plan
        working-directory: policy
        env:
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
        run: |
          mkdir -p "$(dirname "$MODE_PLAN")"
          node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode fix --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --policy-config "$CONFIG" --ready-label-fix true \
            --target-number "${{ inputs.issue_number || github.event.issue.number || github.event.client_payload.number }}" \
            --dry-run-value "${{ inputs.dry_run }}" > "$MODE_PLAN"
          node ../tooling/codekeeper-runtime/src/cli.mjs stage publish --operation preconditions --mode fix \
            --config "$CONFIG" \
            --mode-plan "$MODE_PLAN" \
            --app-contents-permission "${{ inputs.app_contents_permission }}" \
            --app-issues-permission "${{ inputs.app_issues_permission }}" \
            --app-pull-requests-permission "${{ inputs.app_pull_requests_permission }}"
      - name: Download sealed implementation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-fix-artifact-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-artifact
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: ${{ inputs.app_contents_permission }}
          permission-issues: ${{ inputs.app_issues_permission }}
          permission-pull-requests: ${{ inputs.app_pull_requests_permission }}
      - name: Resolve immutable automation bot identity
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
        run: |
          node tooling/codekeeper-runtime/src/cli.mjs stage publish --operation bot --mode fix \
            --config "$CONFIG" \
            --mode-plan "$MODE_PLAN" \
            --token "$GITHUB_TOKEN" \
            --app-slug "$APP_SLUG" \
            --api-url "$GITHUB_API_URL"
      - name: Publish sealed owner-commanded repair
        working-directory: repository
        env:
          CODEKEEPER_TOOLING_SHA: ${{ needs.workspace.outputs.package_source_commit }}
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ steps.bot.outputs.login }}
          CODEKEEPER_AUTOMATION_BOT_ID: ${{ steps.bot.outputs.id }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          AGENT_PROFILE: ${{ github.workspace }}/policy/.github/codekeeper/agents/fixer.md
          MANIFEST_SHA256: ${{ needs.seal.outputs.manifest_sha256 }}
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
        run: |
          node ../tooling/codekeeper-runtime/src/cli.mjs stage publish --operation publish --mode fix \
            --config "$CONFIG" \
            --mode-plan "$MODE_PLAN" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$(git -C "$GITHUB_WORKSPACE/policy" rev-parse HEAD)" \
            --tooling-sha "${{ steps.codekeeper-package.outputs.source_commit }}" \
            --artifact "$RUNNER_TEMP/codekeeper-artifact" \
            --expected-manifest-sha "$MANIFEST_SHA256"
