name: Codekeeper repository assistant

# GitHub.com only: this reusable workflow relies on job.workflow_sha.
on:
  workflow_call:
    inputs:
      enabled:
        required: false
        default: true
        type: boolean
      owner_requests:
        description: Allow configured owners to request bounded Codekeeper actions.
        required: false
        default: true
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login.
        required: true
        type: string
      app_client_id:
        description: GitHub App client ID.
        required: true
        type: string
    secrets:
      app_private_key:
        required: true

permissions:
  contents: read

env:
  CODEKEEPER_TOOLING_MANIFEST_SHA256: 9df1284086f6fd069c324f59f1668784aa617d0c53e71b4d179e4f8d3d04bdb1

concurrency:
  group: codekeeper-assistant-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Codekeeper owner request
    if: >-
      inputs.enabled &&
      inputs.owner_requests &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve automation bot identity
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          identity="$(curl --globoff --fail-with-body --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/users/${APP_SLUG}[bot]")"
          echo "login=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).login))')" >> "$GITHUB_OUTPUT"
          echo "id=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).id))')" >> "$GITHUB_OUTPUT"

      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"

      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: policy
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Route deterministic owner request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_ID: ${{ steps.bot.outputs.id }}
        run: |
          node tooling/tools/codekeeper/src/cli.mjs owner-command \
            --config "$CONFIG" \
            --event "$GITHUB_EVENT_PATH" \
            --automation-bot-login "$BOT_LOGIN" \
            --automation-bot-id "$BOT_ID"
