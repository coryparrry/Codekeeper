name: Codekeeper repository assistant

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      enabled:
        required: false
        default: true
        type: boolean
      owner_requests:
        description: Allow configured owners to request bounded Codekeeper actions.
        required: false
        default: true
        type: boolean
      installed_modes:
        description: Comma-separated workflow modes installed in the adopter repository.
        required: true
        type: string
      automation_bot_login:
        description: Installed GitHub App bot login.
        required: true
        type: string
      app_client_id:
        description: GitHub App client ID.
        required: true
        type: string
    secrets:
      app_private_key:
        required: true

permissions:
  contents: read

concurrency:
  group: codekeeper-assistant-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Codekeeper owner request
    if: >-
      inputs.enabled &&
      inputs.owner_requests &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Acquire exact Codekeeper package
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"

      - name: Authorize configured owner request
        id: authorization
        env:
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { authorizeOwnerRequest } from "./tooling/codekeeper-runtime/src/lib/commands.mjs";
            import { loadConfig } from "./tooling/codekeeper-runtime/src/lib/config.mjs";
            const { config } = await loadConfig(process.env.CONFIG);
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const result = authorizeOwnerRequest({ event, config });
            appendFileSync(process.env.GITHUB_OUTPUT, "authorized=" + String(!result.skipped) + "\n");
          '

      - name: Create short-lived GitHub App token
        if: steps.authorization.outputs.authorized == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve automation bot identity
        if: steps.authorization.outputs.authorized == 'true'
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          identity="$(curl --globoff --fail-with-body --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/users/${APP_SLUG}[bot]")"
          echo "login=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).login))')" >> "$GITHUB_OUTPUT"
          echo "id=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).id))')" >> "$GITHUB_OUTPUT"

      - name: Route deterministic owner request
        if: steps.authorization.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_ID: ${{ steps.bot.outputs.id }}
          INSTALLED_MODES: ${{ inputs.installed_modes }}
        run: |
          node tooling/codekeeper-runtime/src/cli.mjs owner-command \
            --config "$CONFIG" \
            --event "$GITHUB_EVENT_PATH" \
            --automation-bot-login "$BOT_LOGIN" \
            --automation-bot-id "$BOT_ID" \
            --installed-modes "$INSTALLED_MODES"
