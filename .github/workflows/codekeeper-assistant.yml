name: Codekeeper repository assistant

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      package_manifest_sha256:
        description: SHA-256 of the closed package release manifest.
        required: true
        type: string
      package_source_commit:
        description: Source commit read from the verified package manifest.
        required: true
        type: string
      enabled:
        required: false
        default: true
        type: boolean
      runner:
        description: Runner label used by every job in this reusable workflow.
        required: false
        default: ubuntu-latest
        type: string
      owner_requests:
        description: Allow configured owners to request bounded Codekeeper actions.
        required: false
        default: true
        type: boolean
      installed_modes:
        description: Comma-separated workflow modes installed in the adopter repository.
        required: true
        type: string
      automation_bot_login:
        description: Installed GitHub App bot login.
        required: true
        type: string
      app_client_id:
        description: GitHub App client ID.
        required: true
        type: string
    secrets:
      app_private_key:
        required: true

permissions:
  contents: read

env:
  CODEKEEPER_PACKAGE_NAME: codekeeper
  CODEKEEPER_PACKAGE_VERSION: ${{ inputs.package_version }}
  CODEKEEPER_PACKAGE_INTEGRITY: ${{ inputs.package_integrity }}
  CODEKEEPER_PACKAGE_MANIFEST_SHA256: ${{ inputs.package_manifest_sha256 }}
  CODEKEEPER_PACKAGE_SOURCE_COMMIT: ${{ inputs.package_source_commit }}

concurrency:
  group: codekeeper-assistant-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Codekeeper owner request
    if: >-
      inputs.enabled &&
      inputs.owner_requests &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Download bootstrap Codekeeper package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify bootstrap Codekeeper package
        run: |
          TOOLING_ROOT="$GITHUB_WORKSPACE/tooling/tools/codekeeper"
          node "$TOOLING_ROOT/bin/verify-package.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-name "$CODEKEEPER_PACKAGE_NAME" \
            --expected-version "$CODEKEEPER_PACKAGE_VERSION" \
            --expected-integrity "$CODEKEEPER_PACKAGE_INTEGRITY" \
            --expected-manifest-sha256 "$CODEKEEPER_PACKAGE_MANIFEST_SHA256" \
            --expected-source-commit "$CODEKEEPER_PACKAGE_SOURCE_COMMIT"

      - name: Install exact Codekeeper runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/tooling/codekeeper-runtime"
          if test -e "$runtime"; then
            echo "Codekeeper runtime install path already exists" >&2
            exit 1
          fi
          cp -R "$GITHUB_WORKSPACE/tooling/tools/codekeeper/runtime" "$runtime"
          (
            cd "$runtime"
            npm ci --ignore-scripts --no-audit --no-fund
          )

      - name: Check out trusted default-branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: policy
          persist-credentials: false

      - name: Authorize configured owner request
        id: authorization
        env:
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { authorizeOwnerRequest } from "./tooling/codekeeper-runtime/src/lib/commands.mjs";
            import { loadConfig } from "./tooling/codekeeper-runtime/src/lib/config.mjs";
            const { config } = await loadConfig(process.env.CONFIG);
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const result = authorizeOwnerRequest({ event, config });
            appendFileSync(process.env.GITHUB_OUTPUT, "authorized=" + String(!result.skipped) + "\n");
          '

      - name: Create short-lived GitHub App token
        if: steps.authorization.outputs.authorized == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve automation bot identity
        if: steps.authorization.outputs.authorized == 'true'
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          identity="$(curl --globoff --fail-with-body --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/users/${APP_SLUG}[bot]")"
          echo "login=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).login))')" >> "$GITHUB_OUTPUT"
          echo "id=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).id))')" >> "$GITHUB_OUTPUT"

      - name: Route deterministic owner request
        if: steps.authorization.outputs.authorized == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_ID: ${{ steps.bot.outputs.id }}
          INSTALLED_MODES: ${{ inputs.installed_modes }}
        run: |
          node tooling/codekeeper-runtime/src/cli.mjs owner-command \
            --config "$CONFIG" \
            --event "$GITHUB_EVENT_PATH" \
            --automation-bot-login "$BOT_LOGIN" \
            --automation-bot-id "$BOT_ID" \
            --installed-modes "$INSTALLED_MODES"
