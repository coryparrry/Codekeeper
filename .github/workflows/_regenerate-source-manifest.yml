name: Regenerate source manifest

on:
  push:
    branches: [perf/consolidate-review-runners]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Regenerate manifests and remove generator
        run: |
          set -euo pipefail
          git rm .github/workflows/_regenerate-source-manifest.yml
          node tools/codekeeper/scripts/generate-tooling-manifest.mjs --write
          tmp="$(mktemp)"
          while IFS= read -r file; do
            sha256sum "$file"
          done < <(git ls-files | grep -v '^MANIFEST\.sha256$' | LC_ALL=C sort) > "$tmp"
          mv "$tmp" MANIFEST.sha256
          git add MANIFEST.sha256 tools/codekeeper/tooling-manifest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: refresh generated manifests'
          git push origin HEAD:perf/consolidate-review-runners
