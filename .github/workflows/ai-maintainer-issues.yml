name: AI Maintainer issue triage

# GitHub.com only: this reusable workflow relies on job.workflow_repository/job.workflow_sha.
on:
  workflow_call:
    inputs:
      enabled:
        required: false
        default: true
        type: boolean
      app_client_id:
        description: GitHub App client ID. This identifier is not secret.
        required: true
        type: string
    secrets:
      openai_api_key:
        required: true
      app_private_key:
        required: true

permissions:
  contents: read
  issues: read

concurrency:
  group: ai-maintainer-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  analyze:
    # Comment-triggered triage is deliberately maintainer-only. prepare-issue uses
    # the GitHub event payload; it does not execute for arbitrary issue reporters.
    if: >-
      inputs.enabled &&
      !github.event.issue.pull_request &&
      (github.event.comment.body == '/ai-maintainer triage' ||
       startsWith(github.event.comment.body, '/ai-maintainer triage ')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      candidate_sha256: ${{ steps.validate.outputs.candidate_sha256 }}
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
    steps:
      - name: Check out frozen maintainer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Prepare runner-owned issue bundle
        id: prepare
        working-directory: repository
        env:
          AI_MAINTAINER_TOOLING_SHA: ${{ job.workflow_sha }}
          BUNDLE: ${{ runner.temp }}/ai-maintainer-bundle
          CONFIG: ${{ runner.temp }}/ai-maintainer-config.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/ai-maintainer.json
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ ! -e "$CONFIG" ]] || { echo "Frozen config already exists"; exit 1; }
          cp "$SOURCE_CONFIG" "$CONFIG"
          [[ "$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).repository.defaultBranch)' "$CONFIG")" == "$DEFAULT_BRANCH" ]] || {
            echo "Configured default branch does not match the repository default branch"
            exit 1
          }
          node ../tooling/tools/ai-maintainer/src/cli.mjs prepare-issue \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --event "$GITHUB_EVENT_PATH" \
            --actor "$GITHUB_ACTOR" \
            --tooling-sha "$AI_MAINTAINER_TOOLING_SHA"
          {
            echo "context_sha256=$(sha256sum "$BUNDLE/context.json" | awk '{print $1}')"
            echo "model=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).ai.issue.model)' "$CONFIG")"
            echo "effort=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).ai.issue.effort)' "$CONFIG")"
          } >> "$GITHUB_OUTPUT"
      - name: Triage with pinned Codex
        uses: openai/codex-action@10cb888d2ed3b99867f7e7ccff174a861a75aeb6 # v1.9
        with:
          openai-api-key: ${{ secrets.openai_api_key }}
          codex-version: 0.146.0
          model: ${{ steps.prepare.outputs.model }}
          effort: ${{ steps.prepare.outputs.effort }}
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: ${{ github.actor }}
          working-directory: repository
          prompt-file: ${{ runner.temp }}/ai-maintainer-bundle/prompt.md
          output-file: ${{ runner.temp }}/ai-maintainer-bundle/codex-result.json
          output-schema-file: ${{ runner.temp }}/ai-maintainer-bundle/schema.json
      - name: Validate untrusted issue candidate
        id: validate
        working-directory: repository
        env:
          BUNDLE: ${{ runner.temp }}/ai-maintainer-bundle
          CANDIDATE: ${{ runner.temp }}/ai-maintainer-candidate
          CONFIG: ${{ runner.temp }}/ai-maintainer-config.json
        run: |
          node ../tooling/tools/ai-maintainer/src/cli.mjs validate-issue \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --context "$BUNDLE/context.json" \
            --result "$BUNDLE/codex-result.json" \
            --artifact "$CANDIDATE"
      - name: Upload untrusted issue candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-maintainer-issue-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-maintainer-candidate
          retention-days: 1
          if-no-files-found: error

  seal:
    needs: analyze
    if: needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out frozen maintainer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Download untrusted issue candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-maintainer-issue-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-maintainer-candidate
      - name: Seal issue artifact without repository execution
        env:
          CANDIDATE: ${{ runner.temp }}/ai-maintainer-candidate
          ARTIFACT: ${{ runner.temp }}/ai-maintainer-artifact
          CONFIG: ${{ github.workspace }}/repository/.github/ai-maintainer.json
          CANDIDATE_SHA256: ${{ needs.analyze.outputs.candidate_sha256 }}
          CONTEXT_SHA256: ${{ needs.analyze.outputs.context_sha256 }}
        run: |
          node tooling/tools/ai-maintainer/src/cli.mjs seal-issue \
            --config "$CONFIG" \
            --candidate "$CANDIDATE" \
            --artifact "$ARTIFACT" \
            --expected-candidate-sha "$CANDIDATE_SHA256" \
            --expected-context-sha "$CONTEXT_SHA256"
      - name: Upload sealed issue artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-maintainer-issue-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-maintainer-artifact
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: seal
    if: needs.seal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-issues: write
      - name: Resolve immutable automation bot identity
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          identity="$(curl --globoff --fail-with-body --silent --show-error --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/users/${APP_SLUG}[bot]")"
          echo "login=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).login))')" >> "$GITHUB_OUTPUT"
          echo "id=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).id))')" >> "$GITHUB_OUTPUT"
      - name: Check out frozen maintainer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Download sealed issue artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-maintainer-issue-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-maintainer-artifact
      - name: Publish sealed issue triage
        working-directory: tooling
        env:
          AI_MAINTAINER_AUTOMATION_BOT_LOGIN: ${{ steps.bot.outputs.login }}
          AI_MAINTAINER_AUTOMATION_BOT_ID: ${{ steps.bot.outputs.id }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node tools/ai-maintainer/src/cli.mjs publish-issue \
            --artifact "$RUNNER_TEMP/ai-maintainer-artifact"
