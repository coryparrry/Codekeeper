name: Finalize Codekeeper package release contract

on:
  push:
    branches:
      - fix/package-skipped-issue-triage-contract

permissions:
  contents: write

concurrency:
  group: finalize-package-skipped-issue-triage-contract
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/package-skipped-issue-triage-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Add package release contract and refresh source integrity
        env:
          HEAD_BRANCH: fix/package-skipped-issue-triage-contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > packages/codekeeper/test/skipped-issue-triage-release.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const runtimeSource = () =>
            readFile(
              new URL(
                "../../../tools/codekeeper/src/lib/agents-runtime.mjs",
                import.meta.url,
              ),
              "utf8",
            );

          test("packaged release preserves frozen issue evidence when workspace triage is skipped", async () => {
            const source = await runtimeSource();

            assert.match(source, /ISSUE-ONLY EXECUTION MODE:/);
            assert.match(
              source,
              /complete bounded triage evidence; do not require a workspace result/,
            );
            assert.match(
              source,
              /buildIssuePrompt\(context, config, frozenProfile\.text\)/,
            );
            assert.match(
              source,
              /writeFile\(path\.join\(directory, "prompt\.md"\), directPrompt, "utf8"\)/,
            );
            assert.match(
              source,
              /received workspace runtime metadata without specialist evidence/,
            );
          });
          EOF
          node --check packages/codekeeper/test/skipped-issue-triage-release.test.mjs
          node --test packages/codekeeper/test/skipped-issue-triage-release.test.mjs
          rm .github/workflows/codekeeper-manifest-export-temp.yml
          git add packages/codekeeper/test/skipped-issue-triage-release.test.mjs .github/workflows/codekeeper-manifest-export-temp.yml
          git commit -m 'test(runtime): bind skipped issue triage to package release'
          node scripts/refresh-release-manifest.mjs
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
