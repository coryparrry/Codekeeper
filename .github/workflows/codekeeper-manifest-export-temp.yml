name: Temporary Codekeeper manifest export

on:
  push:
    branches:
      - fix/package-skipped-issue-triage-contract
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-manifest-export
          path: MANIFEST.sha256
          if-no-files-found: error
          retention-days: 1
