name: Codekeeper checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codekeeper-checks-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    name: promotion-policy
    runs-on: ${{ vars.CODEKEEPER_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Require staging or Release Please before main
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" || "$BASE_REF" != "main" ]]; then
            exit 0
          fi
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          if [[ "$HEAD_REF" == "staging" || "$HEAD_REF" == release-please--branches--main* ]]; then
            exit 0
          fi
          echo "Pull requests to main must promote staging or be generated by Release Please." >&2
          exit 1

  maintainer-checks:
    runs-on: ${{ vars.CODEKEEPER_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Install repository lint and format tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository lint and format checks
        run: npm run check
      - name: Install pinned Agents SDK runtime
        working-directory: tools/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run maintainer syntax and unit checks
        working-directory: tools/codekeeper
        run: npm run check
      - name: Validate GitHub Actions workflow contracts
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: any
      - name: Syntax-check workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/codekeeper-*.yml"].each { |file| YAML.load_file(file); puts "parsed #{file}" }'

  installer-checks:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.19.0]
    runs-on: ${{ vars.CODEKEEPER_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Install pinned installer runtime
        working-directory: packages/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run installer syntax, unit, Git, TUI, and package checks
        working-directory: packages/codekeeper
        run: npm run check

  acceptance-harness-checks:
    runs-on: ${{ vars.CODEKEEPER_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Run offline acceptance-harness checks
        working-directory: acceptance
        run: npm run check
