name: Codekeeper checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codekeeper-checks-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  maintainer-checks:
    runs-on: ${{ vars.CODEKEEPER_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Install repository lint and format tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository lint and format checks
        run: npm run check
      - name: Install pinned Agents SDK runtime
        working-directory: tools/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run maintainer syntax and unit checks
        working-directory: tools/codekeeper
        run: npm run check
      - name: Validate GitHub Actions workflow contracts
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: any
      - name: Syntax-check workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/codekeeper-*.yml"].each { |file| YAML.load_file(file); puts "parsed #{file}" }'

  installer-checks:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.19.0]
    runs-on: ${{ vars.CODEKEEPER_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Install pinned installer runtime
        working-directory: packages/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run installer syntax, unit, Git, TUI, and package checks
        working-directory: packages/codekeeper
        run: npm run check
      - name: Pack and verify the customer release candidate
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/codekeeper-pr-candidate
          PACK_REPORT: ${{ runner.temp }}/codekeeper-pr-candidate-report.json
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE_ROOT"
          node scripts/pack-codekeeper-package.mjs \
            --candidate \
            --destination "$CANDIDATE_ROOT" > "$PACK_REPORT"
          node scripts/verify-release-candidate.mjs \
            --pack-report "$PACK_REPORT" \
            --tarball-directory "$CANDIDATE_ROOT" \
            --expected-source-commit "$(git rev-parse HEAD)"

  acceptance-harness-checks:
    runs-on: ${{ vars.CODEKEEPER_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Run offline acceptance-harness checks
        working-directory: acceptance
        run: npm run check
