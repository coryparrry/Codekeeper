name: Codekeeper checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintainer-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install repository lint and format tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository lint and format checks
        run: npm run check
      - name: Prepare source manifest refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("MANIFEST.sha256")
          entries = {}
          for line in path.read_text().splitlines():
              digest, name = line.split("  ", 1)
              entries[name] = digest
          entries["packages/codekeeper/src/settings.mjs"] = "50980f01df7571cc07565f61a0ef2ad9635dc1a931900beae1395960d02a04ad"
          entries["packages/codekeeper/test/deferred-issues.test.mjs"] = "5886281d5844b679f22bc73888e026226a8272eeb0ad460dc34575e47eaf1127"
          path.write_text("".join(f"{entries[name]}  {name}\n" for name in sorted(entries)))
          PY
      - name: Upload source manifest refresh
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-manifest-refresh-${{ github.run_id }}
          path: MANIFEST.sha256
          retention-days: 1
          if-no-files-found: error
      - name: Install pinned Agents SDK runtime
        working-directory: tools/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run maintainer syntax and unit checks
        working-directory: tools/codekeeper
        run: npm run check
      - name: Verify source-release integrity
        run: bash scripts/release-source.sh --verify
      - name: Validate GitHub Actions workflow contracts
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: any
      - name: Syntax-check workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/codekeeper-*.yml"].each { |file| YAML.load_file(file); puts "parsed #{file}" }'

  installer-checks:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.19.0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install pinned installer runtime
        working-directory: packages/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run installer syntax, unit, Git, TUI, and package checks
        working-directory: packages/codekeeper
        run: npm run check

  acceptance-harness-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Run offline acceptance-harness checks
        working-directory: acceptance
        run: npm run check
