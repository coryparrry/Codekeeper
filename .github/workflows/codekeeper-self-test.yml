name: Codekeeper checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintainer-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned Agents SDK runtime
        working-directory: tools/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run maintainer syntax and unit checks
        working-directory: tools/codekeeper
        run: npm run check
      - name: Verify source-release integrity
        run: bash scripts/release-source.sh --verify
      - name: Validate GitHub Actions workflow contracts
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: any
      - name: Syntax-check workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/codekeeper-*.yml"].each { |file| YAML.load_file(file); puts "parsed #{file}" }'

  installer-checks:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.19.0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install pinned installer runtime
        working-directory: packages/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run installer syntax, unit, Git, TUI, and package checks
        working-directory: packages/codekeeper
        run: npm run check

  acceptance-harness-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Run offline acceptance-harness checks
        working-directory: acceptance
        run: npm run check
