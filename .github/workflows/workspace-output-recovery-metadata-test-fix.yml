name: Update workspace attempt metadata regression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: workspace-output-recovery-metadata-test-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/workspace-output-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/workspace-output-recovery
          fetch-depth: 0
          persist-credentials: true

      - name: Update the existing metadata contract and verify it
        env:
          HEAD_BRANCH: fix/workspace-output-recovery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 <<'PY'
          from pathlib import Path

          path = Path("tools/codekeeper/test/agents-runtime-workspace.test.mjs")
          content = path.read_text()
          replacements = [
              (
                  '{ tier: "configured", model: "gpt-5.6-luna", effort: "medium", durationMs: 25 },',
                  '{ tier: "configured", model: "gpt-5.6-luna", effort: "medium", attempts: 1, durationMs: 25 },',
              ),
              (
                  '{ tier: "focused-max", model: "gpt-5.6-luna", effort: "max", durationMs: 25 }',
                  '{ tier: "focused-max", model: "gpt-5.6-luna", effort: "max", attempts: 1, durationMs: 25 }',
              ),
          ]
          for old, new in replacements:
              if content.count(old) != 1:
                  raise SystemExit(f"expected one metadata line {old!r}, found {content.count(old)}")
              content = content.replace(old, new)
          path.write_text(content)
          PY

          rm .github/workflows/workspace-output-recovery-metadata-test-fix.yml
          npm --prefix tools/codekeeper ci --ignore-scripts --no-audit --no-fund
          node --test \
            tools/codekeeper/test/agents-runtime-workspace.test.mjs \
            tools/codekeeper/test/workspace-output-recovery.test.mjs
          git diff --check

          git add -A
          git commit -m 'test(runtime): record workspace pass attempts'
          node scripts/refresh-release-manifest.mjs
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
