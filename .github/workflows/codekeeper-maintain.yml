name: Codekeeper maintenance

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      enabled:
        required: false
        default: true
        type: boolean
      dry_run:
        required: false
        default: true
        type: boolean
      app_client_id:
        description: GitHub App client ID. Required only when dry_run=false.
        required: false
        default: ""
        type: string
      app_contents_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: read
        type: string
      app_issues_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: write
        type: string
      app_pull_requests_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: read
        type: string
    secrets:
      model_api_key:
        description: API key for the provider selected by ai.agents.audit.provider.
        required: true
      workspace_api_key:
        description: OpenAI API key for the optional Codex workspace specialist.
        required: false
      openai_api_key:
        description: Deprecated compatibility fallback for the Codex workspace specialist only.
        required: false
      trace_api_key:
        description: Dedicated OpenAI API key used only to export required Agents SDK traces.
        required: false
      app_private_key:
        description: GitHub App private key. Required only when dry_run=false.
        required: false

permissions:
  contents: read

concurrency:
  group: codekeeper-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  runtime:
    if: inputs.enabled
    uses: ./.github/workflows/codekeeper-runtime.yml
    with:
      mode: maintain
      package_version: ${{ inputs.package_version }}
      package_integrity: ${{ inputs.package_integrity }}
      enabled: true
      dry_run: ${{ inputs.dry_run }}
      app_client_id: ${{ inputs.app_client_id }}
    secrets:
      model_api_key: ${{ secrets.model_api_key }}
      workspace_api_key: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
      trace_api_key: ${{ secrets.trace_api_key }}
      app_private_key: ${{ secrets.app_private_key }}
