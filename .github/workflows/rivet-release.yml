name: Publish Rivet

on:
  push:
    tags:
      - "rivet-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Verify protected default-branch ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - name: Verify exact source manifest
        run: bash scripts/release-source.sh --verify
      - name: Install Rivet
        working-directory: packages/rivet
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Rivet checks
        working-directory: packages/rivet
        run: npm run check
      - name: Verify package release identity
        working-directory: packages/rivet
        run: npm run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Verify package contents
        working-directory: packages/rivet
        run: npm run pack:check
      - name: Publish to npm
        working-directory: packages/rivet
        run: npm publish --provenance --access public --ignore-scripts
