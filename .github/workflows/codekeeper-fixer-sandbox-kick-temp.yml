name: Trigger Codekeeper Fixer sandbox finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.pull_request.head.ref == 'fix/codex-sandbox-prerequisites'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codex-sandbox-prerequisites
          fetch-depth: 0
          persist-credentials: true
      - name: Remove trigger and push the finalizer event
        env:
          HEAD_BRANCH: fix/codex-sandbox-prerequisites
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/codekeeper-fixer-sandbox-kick-temp.yml
          git add .github/workflows/codekeeper-fixer-sandbox-kick-temp.yml
          git commit -m 'chore(ci): start Fixer sandbox finalizer'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
