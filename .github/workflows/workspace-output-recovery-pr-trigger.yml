name: Trigger workspace output recovery finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: workspace-output-recovery-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/workspace-output-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/workspace-output-recovery
          fetch-depth: 0
          persist-credentials: true

      - name: Execute reviewed finalizer payload
        env:
          HEAD_BRANCH: fix/workspace-output-recovery
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/workspace-output-recovery-finalizer.sh"
          ruby -ryaml -e '
            workflow = YAML.load_file(ARGV.fetch(0))
            step = workflow.fetch("jobs").fetch("finalize").fetch("steps").find do |item|
              item["name"] == "Apply output recovery contract and regression tests"
            end
            abort("workspace output recovery payload was not found") unless step
            print step.fetch("run")
          ' .github/workflows/workspace-output-recovery-finalizer.yml > "$payload"
          rm .github/workflows/workspace-output-recovery-pr-trigger.yml
          bash "$payload"
