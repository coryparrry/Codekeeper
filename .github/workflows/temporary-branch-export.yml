name: Temporary branch export

on:
  push:
    branches:
      - "fix/broaden-fixer-scope-clean-labels"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export exact branch snapshot
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/codekeeper-branch.tar"

      - name: Upload branch snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-branch-${{ github.sha }}
          path: ${{ runner.temp }}/codekeeper-branch.tar
          retention-days: 1
          if-no-files-found: error
