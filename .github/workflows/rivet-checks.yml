name: Rivet checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivet-checks-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rivet-checks:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.2, 24.19.0]
    runs-on: ${{ vars.RIVET_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Install Rivet
        working-directory: packages/rivet
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Rivet checks
        working-directory: packages/rivet
        run: npm run check

  actionlint:
    runs-on: ${{ vars.RIVET_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: any
