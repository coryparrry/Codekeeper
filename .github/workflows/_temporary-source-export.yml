name: Temporary source export

on:
  pull_request:
    branches: [main]
  push:
    branches: [perf/consolidate-review-runners]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package editable source
        run: |
          tar -czf "$RUNNER_TEMP/codekeeper-source.tgz" \
            .github \
            acceptance \
            docs \
            examples \
            packages \
            scripts \
            tools \
            MANIFEST.sha256 \
            eslint.config.mjs \
            package-lock.json \
            package.json
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-source-snapshot
          path: ${{ runner.temp }}/codekeeper-source.tgz
          retention-days: 1
          if-no-files-found: error
