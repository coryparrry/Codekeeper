name: Finalize Codekeeper Fixer sandbox repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: normalize-codekeeper-fixer-sandbox-v3
  cancel-in-progress: false

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'fix/codex-sandbox-prerequisites'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codex-sandbox-prerequisites
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize source and refresh integrity manifests
        env:
          HEAD_BRANCH: fix/codex-sandbox-prerequisites
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 <<'PY'
          from pathlib import Path

          isolation_path = Path("tools/codekeeper/src/lib/orchestration/workspace-isolation.mjs")
          isolation_lines = isolation_path.read_text().splitlines(keepends=True)
          account_indices = [
              index
              for index, line in enumerate(isolation_lines)
              if line.strip() == "let accountCreated = false;"
          ]
          if len(account_indices) != 1:
              raise SystemExit(
                  f"expected one account creation boundary, found {len(account_indices)}"
              )
          account_index = account_indices[0]
          workspace_indices = [
              index
              for index, line in enumerate(isolation_lines[:account_index])
              if line.strip() == "if (workspaceUser) {"
          ]
          if not workspace_indices:
              raise SystemExit("workspace-user sandbox boundary was not found")
          workspace_index = workspace_indices[-1]
          existing_block = "".join(isolation_lines[workspace_index : account_index + 1])
          if "prepareCodexLinuxSandbox();" not in existing_block:
              raise SystemExit("sandbox prerequisite call was not found at the workspace boundary")
          if account_index - workspace_index > 12:
              raise SystemExit("workspace sandbox boundary is unexpectedly large")

          isolation_lines[workspace_index : account_index + 1] = [
              "  if (workspaceUser) {\n",
              "    // Current GitHub-hosted Ubuntu images can block Codex's Bubblewrap\n",
              "    // user namespace before any repository command starts. Enable the\n",
              "    // same ephemeral-runner prerequisites as OpenAI's codex-action,\n",
              "    // then retain the normal read-only or workspace-write sandbox.\n",
              "    await prepareCodexLinuxSandbox();\n",
              "  }\n",
              "  let accountCreated = false;\n",
          ]
          isolation_path.write_text("".join(isolation_lines))

          schema_path = Path("tools/codekeeper/src/lib/schemas.mjs")
          schema_lines = schema_path.read_text().splitlines(keepends=True)
          result_indices = [
              index
              for index, line in enumerate(schema_lines)
              if "assertString(test.result" in line
          ]
          if len(result_indices) != 1:
              raise SystemExit(
                  f"expected one Fixer test-result validator, found {len(result_indices)}"
              )
          result_index = result_indices[0]
          assert_end = next(
              (
                  index
                  for index in range(result_index + 1, min(result_index + 9, len(schema_lines)))
                  if schema_lines[index].strip() == ");"
              ),
              None,
          )
          if assert_end is None:
              raise SystemExit("Fixer command-receipt assertion terminator was not found")
          existing_assertion = "".join(schema_lines[result_index + 1 : assert_end + 1])
          if "must describe a command that actually ran" not in existing_assertion:
              raise SystemExit("Fixer command-receipt assertion was not found")
          schema_lines[result_index + 1 : assert_end + 1] = [
              "    assert(\n",
              "      !/^did not run(?:\\b|:)/i.test(test.result.trim()),\n",
              "      `testsRun[${index}].result must describe a command that actually ran`,\n",
              "    );\n",
          ]
          schema_path.write_text("".join(schema_lines))
          PY

          rm -f \
            .github/workflows/codekeeper-fixer-sandbox-format-temp.yml \
            .github/workflows/codekeeper-fixer-sandbox-normalize-v2-temp.yml \
            .github/workflows/codekeeper-fixer-sandbox-normalize-v3-temp.yml

          node --check tools/codekeeper/src/lib/orchestration/workspace-isolation.mjs
          node --check tools/codekeeper/src/lib/schemas.mjs
          node --check tools/codekeeper/test/workspace-sandbox-prerequisites.test.mjs
          node --check packages/codekeeper/test/fixer-sandbox-release.test.mjs
          node --test \
            tools/codekeeper/test/workspace-sandbox-prerequisites.test.mjs \
            packages/codekeeper/test/fixer-sandbox-release.test.mjs
          node tools/codekeeper/scripts/generate-tooling-manifest.mjs --write
          git diff --check

          git add -A
          git commit -m 'style(runtime): normalize Fixer sandbox repair'
          node scripts/refresh-release-manifest.mjs
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
