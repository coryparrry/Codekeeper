name: Bootstrap trusted repository context PR

on:
  push:
    branches:
      - agent/trusted-repository-context
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'agent/trusted-repository-context')
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct verified source files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-context/runtime/*.b64 | base64 --decode | xz --decompress > tools/codekeeper/src/lib/agents-runtime.mjs
          cat .bootstrap-context/manifest/*.b64 | base64 --decode | xz --decompress > MANIFEST.sha256

          test "$(git hash-object tools/codekeeper/src/lib/agents-runtime.mjs)" = "867bff2af1e91065fb04b17723598342907b1e55"
          test "$(git hash-object MANIFEST.sha256)" = "b2737f6c1ea8cdefe4c72a9c9846063668a5dd57"
          test "$(git hash-object .github/codekeeper.json)" = "296ea79714a5a1991fdd005330dbc71ce561fc73"
          test "$(git hash-object tools/codekeeper/test/repository-context.test.mjs)" = "5766c3dedbf81363fb14def363b4d5a9cb1e1562"
          test "$(git hash-object tools/codekeeper/tooling-manifest.json)" = "a2735679c94db3b5b120238f535b9ce77d116061"

          node --check tools/codekeeper/src/lib/agents-runtime.mjs
          node --check tools/codekeeper/test/repository-context.test.mjs

      - name: Commit final source change
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf .bootstrap-context .github/workflows/bootstrap-context-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(agents): require trusted repository context"
          git push origin "HEAD:${TARGET_BRANCH}"
