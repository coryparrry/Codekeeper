name: Codekeeper issue triage

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      enabled:
        required: false
        default: true
        type: boolean
      auto_triage:
        description: Automatically triage eligible issue lifecycle events.
        required: false
        default: true
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login, used to authenticate owner-requested dispatches.
        required: false
        default: ""
        type: string
      app_client_id:
        description: GitHub App client ID. This identifier is not secret.
        required: true
        type: string
      app_contents_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: read
        type: string
      app_issues_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: write
        type: string
      app_pull_requests_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: read
        type: string
    secrets:
      model_api_key:
        description: API key for the provider selected by ai.agents.issue.provider.
        required: true
      workspace_api_key:
        description: OpenAI API key for the optional Codex workspace specialist.
        required: false
      openai_api_key:
        description: Deprecated compatibility fallback for the Codex workspace specialist only.
        required: false
      trace_api_key:
        description: Dedicated OpenAI API key used only to export required Agents SDK traces.
        required: false
      app_private_key:
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codekeeper-issue-${{ github.event.issue.number || github.event.client_payload.number }}
  cancel-in-progress: false

jobs:
  runtime:
    # CODEKEEPER_OWNER_COMMANDS_START
    if: >-
      inputs.enabled &&
      !github.event.issue.pull_request &&
      (
        (
          inputs.auto_triage &&
          (
            (github.event_name == 'issues' &&
             (github.event.action == 'opened' ||
              github.event.action == 'reopened' ||
              github.event.action == 'edited' ||
              github.event.action == 'closed')) ||
            (github.event_name == 'issue_comment' &&
             github.event.action == 'created' &&
             contains(github.event.issue.labels.*.name, 'codekeeper:needs-information') &&
             github.event.comment.user.login != inputs.automation_bot_login &&
             (github.event.comment.user.login == github.event.issue.user.login ||
              contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
             !contains(fromJSON('["/codekeeper help","/codekeeper status","/codekeeper review","/codekeeper rerun","/codekeeper triage","/codekeeper implement","/codekeeper repair","/codekeeper fix","/codekeeper defer","/codekeeper pause","/codekeeper stop"]'), github.event.comment.body))
          )
        ) ||
        (github.event_name == 'repository_dispatch' &&
         github.event.action == 'codekeeper_issue' &&
         inputs.automation_bot_login != '' &&
         github.actor == inputs.automation_bot_login)
      )
    # CODEKEEPER_OWNER_COMMANDS_END
    uses: ./.github/workflows/codekeeper-runtime.yml
    with:
      mode: issues
      package_version: ${{ inputs.package_version }}
      package_integrity: ${{ inputs.package_integrity }}
      enabled: true
      dry_run: false
      automation_bot_login: ${{ inputs.automation_bot_login }}
      app_client_id: ${{ inputs.app_client_id }}
    secrets:
      model_api_key: ${{ secrets.model_api_key }}
      workspace_api_key: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
      trace_api_key: ${{ secrets.trace_api_key }}
      app_private_key: ${{ secrets.app_private_key }}
