name: Diagnose Codekeeper 0.4.10 publication

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'diag/release-0.4.10-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diag/release-0.4.10-publish
          fetch-depth: 0
          persist-credentials: true

      - name: Capture release workflow and registry state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 884e380ee31f4dd595ec963f3a0197cdeaf40d68
          RELEASE_VERSION: 0.4.10
          HEAD_BRANCH: diag/release-0.4.10-publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p diag
          report=diag/release-0.4.10-publish.txt

          {
            printf 'Codekeeper %s publication diagnostic\n\n' "$RELEASE_VERSION"
            printf 'SOURCE_SHA=%s\n\n' "$RELEASE_SHA"
            printf '%s\n' '--- RELEASE WORKFLOW RUNS ---'
          } > "$report"

          runs="$RUNNER_TEMP/release-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codekeeper-release.yml/runs?per_page=20" > "$runs"
          jq -r --arg sha "$RELEASE_SHA" '
            .workflow_runs[] |
            select(.head_sha == $sha or .head_branch == "codekeeper-v0.4.10") |
            ["RUN", (.id|tostring), "event="+.event, "status="+.status, "conclusion="+(.conclusion//"null"), "head_branch="+(.head_branch//""), "head_sha="+(.head_sha//""), "created_at="+.created_at, "updated_at="+.updated_at, "url="+.html_url] | join(" ")
          ' "$runs" >> "$report"

          mapfile -t run_ids < <(jq -r --arg sha "$RELEASE_SHA" '.workflow_runs[] | select(.head_sha == $sha or .head_branch == "codekeeper-v0.4.10") | .id' "$runs")
          for run_id in "${run_ids[@]}"; do
            jobs="$RUNNER_TEMP/release-jobs-$run_id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$jobs"
            jq -r '
              .jobs[] |
              "JOB \(.id) \(.name) status=\(.status) conclusion=\(.conclusion // "null")\n" +
              ((.steps // []) | map("  STEP \(.number) \(.name) status=\(.status) conclusion=\(.conclusion // "null")") | join("\n"))
            ' "$jobs" >> "$report"
          done

          {
            printf '\n%s\n' '--- NPM REGISTRY ---'
            printf 'version='; npm view "@coryparry/codekeeper@$RELEASE_VERSION" version --json 2>&1 || true
            printf 'integrity='; npm view "@coryparry/codekeeper@$RELEASE_VERSION" dist.integrity --json 2>&1 || true
            printf 'dist-tags='; npm view '@coryparry/codekeeper' dist-tags --json 2>&1 || true
          } >> "$report"

          rm .github/workflows/diag-release-0.4.10-publish.yml
          git add -A
          git commit -m 'chore: capture Codekeeper 0.4.10 publication state'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
