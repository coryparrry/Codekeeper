name: Publish Codekeeper release

on:
  push:
    tags:
      - "codekeeper-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing codekeeper-vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codekeeper-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      filename: ${{ steps.receipt.outputs.filename }}
      integrity: ${{ steps.receipt.outputs.integrity }}
      manifest_sha256: ${{ steps.receipt.outputs.manifest_sha256 }}
      name: ${{ steps.receipt.outputs.name }}
      source_commit: ${{ steps.receipt.outputs.source_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.receipt.outputs.version }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^codekeeper-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tag must be codekeeper-vX.Y.Z" >&2
            exit 1
          }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Confirm public provenance source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          test "$visibility" = "public" || {
            echo "npm provenance requires a public source repository; current visibility: $visibility" >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm local release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          git tag --points-at HEAD "$RELEASE_TAG" | grep -Fx "$RELEASE_TAG"
      - name: Freeze release authority checkpoint
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          git update-ref refs/remotes/origin/main HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Bind remote release tag to source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node scripts/release-tag-integrity.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --expected-commit "$(git rev-parse HEAD)"
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Confirm clean source snapshot
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install repository checks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source release inventory
        run: npm run check
      - name: Install runtime checks
        working-directory: tools/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify runtime checks
        working-directory: tools/codekeeper
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL npm run check
      - name: Install installer checks
        working-directory: packages/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify installer package checks
        working-directory: packages/codekeeper
        run: npm run check
      - name: Pack a verified release outside the checkout
        env:
          RELEASE_ROOT: ${{ runner.temp }}/codekeeper-release
        run: |
          set -euo pipefail
          test ! -e "$RELEASE_ROOT"
          node scripts/pack-codekeeper-package.mjs --destination "$RELEASE_ROOT" > "$RUNNER_TEMP/codekeeper-pack-report.json"
      - name: Verify local package receipt
        id: receipt
        env:
          RELEASE_ROOT: ${{ runner.temp }}/codekeeper-release
          PACK_REPORT: ${{ runner.temp }}/codekeeper-pack-report.json
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          RELEASE_ROOT="$RELEASE_ROOT" PACK_REPORT="$PACK_REPORT" EXPECTED_SOURCE_COMMIT="$(git rev-parse HEAD)" node --input-type=module -e '
          import { createHash } from "node:crypto";
          import { lstatSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { basename, join } from "node:path";
          import { execFileSync } from "node:child_process";
          const expectedName = JSON.parse(readFileSync("packages/codekeeper/package.json", "utf8")).name;
          if (typeof expectedName !== "string" || expectedName.length === 0) throw new Error("installer package name is missing");
          const report = JSON.parse(readFileSync(process.env.PACK_REPORT, "utf8"));
          if (!report || report.name !== expectedName || !/^\d+\.\d+\.\d+/.test(report.version) || !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(report.integrity)) throw new Error("invalid local npm pack receipt");
          if (typeof report.filename !== "string" || basename(report.filename) !== report.filename || !report.filename.endsWith(".tgz") || report.filename.includes("\n")) throw new Error("packed tarball filename is unsafe");
          const tarball = join(process.env.RELEASE_ROOT, report.filename);
          if (basename(tarball) !== report.filename || !lstatSync(tarball).isFile()) throw new Error("packed tarball is missing");
          const integrity = `sha512-${createHash("sha512").update(readFileSync(tarball)).digest("base64")}`;
          if (integrity !== report.integrity) throw new Error("packed tarball integrity mismatch");
          const root = mkdtempSync(join(tmpdir(), "codekeeper-release-verify-"));
          try {
            execFileSync("tar", ["-xzf", tarball, "--strip-components=1", "-C", root], { stdio: "inherit" });
            const manifestBytes = readFileSync(join(root, "release", "manifest.json"));
            const manifestSha256 = createHash("sha256").update(manifestBytes).digest("hex");
            const manifest = JSON.parse(manifestBytes.toString("utf8"));
            writeFileSync(join(root, "release", "package-integrity.json"), `${JSON.stringify({ version: 1, algorithm: "sha512", integrity }, null, 2)}\n`, { flag: "wx" });
            const verificationOutput = execFileSync(process.execPath, ["bin/verify-package.mjs", "--root", root, "--expected-name", expectedName, "--expected-version", report.version, "--expected-integrity", integrity, "--expected-manifest-sha256", manifestSha256, "--expected-source-commit", process.env.EXPECTED_SOURCE_COMMIT], { cwd: root, encoding: "utf8" });
            if (!verificationOutput.startsWith("CODEKEEPER_PACKAGE_VERIFIED ")) throw new Error("packaged verifier returned an unexpected receipt");
            process.stdout.write(`name=${expectedName}\nfilename=${report.filename}\nintegrity=${integrity}\nversion=${manifest.package.version}\nsource_commit=${manifest.source.commit}\nmanifest_sha256=${manifestSha256}\n`);
          } finally {
            rmSync(root, { recursive: true, force: true });
          }
          ' >> "$GITHUB_OUTPUT"
      - name: Upload verified release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-release-${{ steps.receipt.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/codekeeper-release/${{ steps.receipt.outputs.filename }}
          if-no-files-found: error
          retention-days: 7
      - name: Attest verified release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/codekeeper-release/${{ steps.receipt.outputs.filename }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Download verified release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-release-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/codekeeper-release
      - name: Reverify publish input
        env:
          RELEASE_ROOT: ${{ runner.temp }}/codekeeper-release
          EXPECTED_FILENAME: ${{ needs.build.outputs.filename }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          EXPECTED_NAME: ${{ needs.build.outputs.name }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$RELEASE_ROOT/$EXPECTED_FILENAME"
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64)"
          test "$actual_integrity" = "$EXPECTED_INTEGRITY"
          stage="$RUNNER_TEMP/codekeeper-release-publish-input"
          mkdir "$stage"
          tar -xzf "$tarball" --strip-components=1 -C "$stage"
          # shellcheck disable=SC2016
          STAGE="$stage" EXPECTED_INTEGRITY="$EXPECTED_INTEGRITY" node --input-type=module -e '
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          if (!/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(process.env.EXPECTED_INTEGRITY)) throw new Error("invalid expected package integrity");
          writeFileSync(join(process.env.STAGE, "release", "package-integrity.json"), `${JSON.stringify({ version: 1, algorithm: "sha512", integrity: process.env.EXPECTED_INTEGRITY }, null, 2)}\n`, { flag: "wx" });
          '
          node "$stage/bin/verify-package.mjs" \
            --root "$stage" \
            --expected-name "$EXPECTED_NAME" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-integrity "$EXPECTED_INTEGRITY" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
      - name: Reconfirm remote release tag before registry mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          node scripts/release-tag-integrity.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --expected-commit "$SOURCE_COMMIT"
      - name: Determine npm publication state
        id: publication-state
        env:
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
          EXPECTED_NAME: ${{ needs.build.outputs.name }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/codekeeper-public-npmrc
        run: |
          set -euo pipefail
          : > "$NPM_CONFIG_USERCONFIG"
          receipt="$RUNNER_TEMP/codekeeper-prepublish-receipt.json"
          error_report="$RUNNER_TEMP/codekeeper-prepublish-error.json"
          set +e
          npm view "$EXPECTED_NAME@$EXPECTED_VERSION" version dist.integrity --json > "$receipt" 2> "$error_report"
          status=$?
          set -e
          if (( status == 0 )); then
            RECEIPT="$receipt" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_INTEGRITY="$EXPECTED_INTEGRITY" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const receipt = JSON.parse(readFileSync(process.env.RECEIPT, "utf8"));
            if (receipt?.version !== process.env.EXPECTED_VERSION || receipt?.dist?.integrity !== process.env.EXPECTED_INTEGRITY) throw new Error("existing public npm release does not match the verified tarball");
            '
            printf 'should_publish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RECEIPT="$receipt" node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const error = JSON.parse(readFileSync(process.env.RECEIPT, "utf8"));
          if (error?.error?.code !== "E404") throw new Error("npm lookup failed without a confirmed E404");
          '
          printf 'should_publish=true\n' >> "$GITHUB_OUTPUT"
      - name: Publish exact verified tarball with npm provenance
        if: steps.publication-state.outputs.should_publish == 'true'
        env:
          TARBALL: ${{ runner.temp }}/codekeeper-release/${{ needs.build.outputs.filename }}
        run: npm publish "$TARBALL" --access public --provenance --ignore-scripts
      - name: Re-fetch and verify public registry receipt
        env:
          EXPECTED_FILENAME: ${{ needs.build.outputs.filename }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          EXPECTED_NAME: ${{ needs.build.outputs.name }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/codekeeper-public-npmrc
        run: |
          set -euo pipefail
          : > "$NPM_CONFIG_USERCONFIG"
          receipt="$RUNNER_TEMP/codekeeper-registry-receipt.json"
          npm view "$EXPECTED_NAME@$EXPECTED_VERSION" version dist.integrity dist.tarball --json > "$receipt"
          RECEIPT="$receipt" EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_INTEGRITY="$EXPECTED_INTEGRITY" node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const receipt = JSON.parse(readFileSync(process.env.RECEIPT, "utf8"));
          if (receipt.version !== process.env.EXPECTED_VERSION || receipt?.dist?.integrity !== process.env.EXPECTED_INTEGRITY || typeof receipt?.dist?.tarball !== "string" || !receipt.dist.tarball.startsWith("https://registry.npmjs.org/")) throw new Error("public npm registry receipt does not match the published release");
          '
          download="$RUNNER_TEMP/codekeeper-registry-download"
          mkdir "$download"
          npm pack --json --ignore-scripts --pack-destination "$download" "$EXPECTED_NAME@$EXPECTED_VERSION" > "$download/report.json"
          actual_tarball="$download/$EXPECTED_FILENAME"
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$actual_tarball" | base64)"
          test "$actual_integrity" = "$EXPECTED_INTEGRITY"
          stage="$RUNNER_TEMP/codekeeper-registry-stage"
          mkdir "$stage"
          tar -xzf "$actual_tarball" --strip-components=1 -C "$stage"
          # shellcheck disable=SC2016
          STAGE="$stage" EXPECTED_INTEGRITY="$EXPECTED_INTEGRITY" node --input-type=module -e '
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          if (!/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(process.env.EXPECTED_INTEGRITY)) throw new Error("invalid expected package integrity");
          writeFileSync(join(process.env.STAGE, "release", "package-integrity.json"), `${JSON.stringify({ version: 1, algorithm: "sha512", integrity: process.env.EXPECTED_INTEGRITY }, null, 2)}\n`, { flag: "wx" });
          '
          node "$stage/bin/verify-package.mjs" \
            --root "$stage" \
            --expected-name "$EXPECTED_NAME" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-integrity "$EXPECTED_INTEGRITY" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
      - name: Run fresh exact-version install canary
        env:
          EXPECTED_NAME: ${{ needs.build.outputs.name }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/codekeeper-canary-npmrc
        run: |
          set -euo pipefail
          : > "$NPM_CONFIG_USERCONFIG"
          canary="$RUNNER_TEMP/codekeeper-release-canary"
          mkdir "$canary"
          (
            cd "$canary"
            npm install --ignore-scripts --no-audit --no-fund "$EXPECTED_NAME@$EXPECTED_VERSION"
            # shellcheck disable=SC2016
            installed_version="$(EXPECTED_NAME="$EXPECTED_NAME" node --input-type=module -e 'import { createRequire } from "node:module"; const require = createRequire(import.meta.url); process.stdout.write(require(`${process.env.EXPECTED_NAME}/package.json`).version)')"
            test "$installed_version" = "$EXPECTED_VERSION"
            ./node_modules/.bin/codekeeper --help
          )
      - name: Reconfirm remote release tag before GitHub Release mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          node scripts/release-tag-integrity.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --expected-commit "$SOURCE_COMMIT"
      - name: Create immutable-tag GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
          TARBALL: ${{ runner.temp }}/codekeeper-release/${{ needs.build.outputs.filename }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^codekeeper-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test "${RELEASE_TAG#codekeeper-v}" = "$RELEASE_VERSION"
          test -f "$TARBALL"
          sidecar="$TARBALL.sha512"
          sha512sum "$TARBALL" > "$sidecar"
          notes="$RUNNER_TEMP/codekeeper-github-release-notes.md"
          # shellcheck disable=SC2016
          RELEASE_VERSION="$RELEASE_VERSION" SOURCE_COMMIT="$SOURCE_COMMIT" node --input-type=module -e '
          const version = process.env.RELEASE_VERSION;
          const source = process.env.SOURCE_COMMIT;
          process.stdout.write(`Codekeeper ${version} is a verified release of the repository-owned AI maintainer that runs in GitHub Actions.\n\n## Install\n\n\`\`\`bash\nnpx @coryparry/codekeeper@${version} init\n\`\`\`\n\nAfter merging the generated setup pull request, verify the installation with:\n\n\`\`\`bash\nnpx @coryparry/codekeeper@${version} verify\n\`\`\`\n\n## Release integrity\n\n- Verified package source: \`${source}\`\n- The npm package is published with provenance.\n- The verified tarball and its SHA-512 receipt are attached to this release.\n`);
          ' > "$notes"
          release="$RUNNER_TEMP/codekeeper-github-release.json"
          release_error="$RUNNER_TEMP/codekeeper-github-release-error.txt"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release" 2> "$release_error"; then
            # JavaScript template literals are intentionally passed verbatim.
            # shellcheck disable=SC2016
            EXPECTED_BODY_FILE="$notes" RELEASE="$release" RELEASE_TAG="$RELEASE_TAG" RELEASE_VERSION="$RELEASE_VERSION" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync(process.env.RELEASE, "utf8"));
            const expectedTitle = `Codekeeper ${process.env.RELEASE_VERSION}`;
            const expectedBody = readFileSync(process.env.EXPECTED_BODY_FILE, "utf8");
            if (release?.tag_name !== process.env.RELEASE_TAG || release?.name !== expectedTitle || release?.body !== expectedBody || release?.draft !== false || release?.prerelease !== false) throw new Error("existing GitHub release metadata does not match the verified release");
            '
          else
            grep -Fx 'gh: Not Found (HTTP 404)' "$release_error"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Codekeeper $RELEASE_VERSION" \
              --notes-file "$notes" \
              --verify-tag
          fi
          gh release upload "$RELEASE_TAG" "$TARBALL" "$sidecar" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          download="$RUNNER_TEMP/codekeeper-github-release-assets"
          mkdir "$download"
          tarball_name="$(basename "$TARBALL")"
          sidecar_name="$(basename "$sidecar")"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$tarball_name" --dir "$download"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$sidecar_name" --dir "$download"
          cmp -s "$TARBALL" "$download/$tarball_name"
          cmp -s "$sidecar" "$download/$sidecar_name"
