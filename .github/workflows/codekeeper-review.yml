name: Codekeeper review

# GitHub.com only: job.workflow_sha is unavailable on GHES.
# Forks, drafts, merge queues, disabled runs, and non-default-branch PR targets fail
# closed. Do not make this gate required for merge queues unless merge_group support
# is intentionally added and verified.
on:
  workflow_call:
    inputs:
      enabled:
        description: Run the AI review. false intentionally fails the required gate.
        required: false
        default: true
        type: boolean
      auto_review:
        description: Automatically review eligible pull request events.
        required: false
        default: true
        type: boolean
      feedback_triage:
        description: Automatically triage pull request reviews and review comments.
        required: false
        default: true
        type: boolean
      owner_command:
        description: The trusted caller classified this review comment as an owner command.
        required: false
        default: false
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login, used only to admit its own PRs.
        required: false
        default: ""
        type: string
      app_client_id:
        description: GitHub App client ID. This identifier is not secret.
        required: true
        type: string
    secrets:
      model_api_key:
        description: API key for the provider selected by ai.agents.review.provider.
        required: true
      workspace_api_key:
        description: OpenAI API key for the optional Codex workspace specialist.
        required: false
      openai_api_key:
        description: Deprecated compatibility fallback for the Codex workspace specialist only.
        required: false
      trace_api_key:
        description: Dedicated OpenAI API key used only to export required Agents SDK traces.
        required: false
      app_private_key:
        required: true

permissions:
  contents: read

env:
  CODEKEEPER_TOOLING_MANIFEST_SHA256: 81b854780e584598d8312b60d41606a0f31de7423a7f0327b272cde6259467f8

concurrency:
  group: codekeeper-review-${{ github.event.pull_request.number || github.event.client_payload.number }}
  cancel-in-progress: ${{ github.actor != inputs.automation_bot_login }}

jobs:
  workspace:
    name: Codekeeper review workspace specialist
    if: >-
      inputs.enabled &&
      !inputs.owner_command &&
      ((github.event_name == 'repository_dispatch' &&
        github.event.action == 'codekeeper_review' &&
        github.actor == inputs.automation_bot_login) ||
       (((inputs.auto_review && github.event_name == 'pull_request_target') ||
         (inputs.feedback_triage &&
          inputs.automation_bot_login != '' &&
          github.actor != inputs.automation_bot_login &&
          !(github.event_name == 'pull_request_review_comment' &&
            (github.event.comment.author_association == 'OWNER' ||
             github.event.comment.author_association == 'MEMBER' ||
             github.event.comment.author_association == 'COLLABORATOR') &&
            contains(fromJSON('["/codekeeper status","/codekeeper review","/codekeeper rerun","/codekeeper triage","/codekeeper defer","/codekeeper implement","/codekeeper fix","/codekeeper stop"]'), github.event.comment.body)) &&
          (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment'))) &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
    steps:
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"

      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false

      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha }}
          fetch-depth: 0
          path: worktree
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Prepare runner-owned review bundle
        id: prepare
        working-directory: worktree
        env:
          CODEKEEPER_TOOLING_SHA: ${{ job.workflow_sha }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/pr-reviewer.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
        run: |
          [[ ! -e "$CONFIG" ]] || { echo "Frozen config already exists"; exit 1; }
          cp "$SOURCE_CONFIG" "$CONFIG"
          [[ "$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).repository.defaultBranch)' "$CONFIG")" == "$DEFAULT_BRANCH" ]] || {
            echo "Configured default branch does not match the repository default branch"
            exit 1
          }
          AGENT_PROFILE_SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/repository" rev-parse HEAD)"
          node ../tooling/tools/codekeeper/src/cli.mjs prepare-review \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$AGENT_PROFILE_SOURCE_SHA" \
            --event "$GITHUB_EVENT_PATH" \
            --tooling-sha "$CODEKEEPER_TOOLING_SHA"
          {
            echo "context_sha256=$(sha256sum "$BUNDLE/context.json" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve review agent settings
        id: settings
        working-directory: worktree
        env:
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs agent-settings \
            --config "$CONFIG" \
            --mode review

      - name: Require optional workspace specialist key
        if: steps.settings.outputs.workspace_enabled == 'true'
        env:
          WORKSPACE_API_KEY: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
        run: |
          test -n "$WORKSPACE_API_KEY" || {
            echo "workspace_api_key is required because ai.agents.review.workspace.enabled=true"
            exit 1
          }

      - name: Isolate Codex from repository instruction surfaces
        if: steps.settings.outputs.workspace_enabled == 'true'
        working-directory: worktree
        env:
          CODEX_HOME: ${{ runner.temp }}/codekeeper-codex-home
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
          REPOSITORY_PATH: ${{ github.workspace }}/worktree
        run: |
          test ! -e "$CODEX_HOME" || { echo "Isolated Codex home already exists"; exit 1; }
          test ! -e "$QUARANTINE" || { echo "Repository skill quarantine already exists"; exit 1; }
          test ! -L .agents || { echo "Refusing symlinked .agents instruction root"; exit 1; }
          test ! -L .codex || { echo "Refusing symlinked .codex instruction root"; exit 1; }
          install -d -m 700 "$CODEX_HOME" "$QUARANTINE"
          {
            echo 'project_doc_max_bytes = 0'
            echo 'project_doc_fallback_filenames = []'
            echo
            echo '[skills]'
            echo 'include_instructions = false'
            echo 'bundled = { enabled = false }'
            echo
            printf '[projects.%s]\n' "$(node -p 'JSON.stringify(process.env.REPOSITORY_PATH)')"
            echo 'trust_level = "untrusted"'
          } > "$CODEX_HOME/config.toml"
          for surface in .agents/skills .codex/skills; do
            if [ -e "$surface" ] || [ -L "$surface" ]; then
              mkdir -p "$QUARANTINE/$(dirname "$surface")"
              mv -- "$surface" "$QUARANTINE/$surface"
            fi
          done
      - name: Review with optional Codex specialist
        if: steps.settings.outputs.workspace_enabled == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
          codex-home: ${{ runner.temp }}/codekeeper-codex-home
          codex-version: 0.146.0
          model: ${{ steps.settings.outputs.workspace_model }}
          effort: ${{ steps.settings.outputs.workspace_effort }}
          sandbox: ${{ steps.settings.outputs.workspace_sandbox }}
          safety-strategy: drop-sudo
          working-directory: worktree
          prompt-file: ${{ runner.temp }}/codekeeper-bundle/workspace-prompt.md
          output-file: ${{ runner.temp }}/codekeeper-bundle/workspace-result.json
          output-schema-file: ${{ runner.temp }}/codekeeper-bundle/schema.json
          allow-bot-users: ${{ format('{0},dependabot[bot]', inputs.automation_bot_login) }}

      - name: Restore quarantined repository skills
        if: always() && steps.settings.outputs.workspace_enabled == 'true'
        working-directory: worktree
        env:
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
        run: |
          contaminated=false
          for surface in .agents/skills .codex/skills; do
            if [ -e "$surface" ] || [ -L "$surface" ]; then
              mkdir -p "$QUARANTINE/generated/$(dirname "$surface")"
              mv -- "$surface" "$QUARANTINE/generated/$surface"
              contaminated=true
            fi
            if [ -e "$QUARANTINE/$surface" ] || [ -L "$QUARANTINE/$surface" ]; then
              mkdir -p "$(dirname "$surface")"
              mv -- "$QUARANTINE/$surface" "$surface"
            fi
          done
          [ "$contaminated" = false ] || { echo "Codex created a quarantined instruction surface"; exit 1; }
      - name: Upload untrusted workspace evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-review-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-bundle
          retention-days: 1
          if-no-files-found: error

  analyze:
    name: Codekeeper review analysis
    needs: workspace
    if: needs.workspace.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidate_sha256: ${{ steps.validate.outputs.candidate_sha256 }}
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
    steps:
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"

      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false

      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha }}
          fetch-depth: 0
          path: worktree
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install pinned Agents SDK runtime
        working-directory: tooling/tools/codekeeper
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download untrusted workspace evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-review-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-workspace

      - name: Prepare runner-owned review bundle
        id: prepare
        working-directory: worktree
        env:
          CODEKEEPER_TOOLING_SHA: ${{ job.workflow_sha }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/pr-reviewer.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
        run: |
          [[ ! -e "$CONFIG" ]] || { echo "Frozen config already exists"; exit 1; }
          cp "$SOURCE_CONFIG" "$CONFIG"
          [[ "$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).repository.defaultBranch)' "$CONFIG")" == "$DEFAULT_BRANCH" ]] || {
            echo "Configured default branch does not match the repository default branch"
            exit 1
          }
          AGENT_PROFILE_SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/repository" rev-parse HEAD)"
          node ../tooling/tools/codekeeper/src/cli.mjs prepare-review \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$AGENT_PROFILE_SOURCE_SHA" \
            --event "$GITHUB_EVENT_PATH" \
            --tooling-sha "$CODEKEEPER_TOOLING_SHA"
          {
            echo "context_sha256=$(sha256sum "$BUNDLE/context.json" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Bind workspace evidence to frozen context
        env:
          WORKSPACE_CONTEXT_SHA256: ${{ needs.workspace.outputs.context_sha256 }}
          COORDINATOR_CONTEXT_SHA256: ${{ steps.prepare.outputs.context_sha256 }}
        run: |
          test -n "$WORKSPACE_CONTEXT_SHA256" || { echo "Workspace context digest is missing"; exit 1; }
          test -n "$COORDINATOR_CONTEXT_SHA256" || { echo "Coordinator context digest is missing"; exit 1; }
          [[ "$WORKSPACE_CONTEXT_SHA256" == "$COORDINATOR_CONTEXT_SHA256" ]] || {
            echo "Workspace evidence does not match the frozen coordinator context"
            exit 1
          }

      - name: Finalize review with configured Agents SDK model
        working-directory: worktree
        env:
          CODEKEEPER_MODEL_API_KEY: ${{ secrets.model_api_key }}
          CODEKEEPER_TRACE_API_KEY: ${{ secrets.trace_api_key }}
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          WORKSPACE: ${{ runner.temp }}/codekeeper-workspace
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs run-agent \
            --config "$CONFIG" \
            --mode review \
            --directory "$BUNDLE" \
            --workspace-result "$WORKSPACE/workspace-result.json" \
            --result "$BUNDLE/agent-result.json"

      - name: Validate untrusted review candidate
        id: validate
        working-directory: worktree
        env:
          BUNDLE: ${{ runner.temp }}/codekeeper-bundle
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
        run: |
          node ../tooling/tools/codekeeper/src/cli.mjs validate-review \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --context "$BUNDLE/context.json" \
            --result "$BUNDLE/agent-result.json" \
            --artifact "$CANDIDATE"

      - name: Upload untrusted review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-review-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-candidate
          retention-days: 1
          if-no-files-found: error

  seal:
    name: Codekeeper review seal
    needs: analyze
    if: needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    permissions:
      contents: read
    steps:
      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"

      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Download untrusted review candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-review-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-candidate

      - name: Seal review artifact without repository execution
        id: seal
        env:
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          ARTIFACT: ${{ runner.temp }}/codekeeper-artifact
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          CANDIDATE_SHA256: ${{ needs.analyze.outputs.candidate_sha256 }}
          CONTEXT_SHA256: ${{ needs.analyze.outputs.context_sha256 }}
        run: |
          node tooling/tools/codekeeper/src/cli.mjs seal-review \
            --config "$CONFIG" \
            --candidate "$CANDIDATE" \
            --artifact "$ARTIFACT" \
            --expected-candidate-sha "$CANDIDATE_SHA256" \
            --expected-context-sha "$CONTEXT_SHA256"

      - name: Upload sealed review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-review-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-artifact
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Codekeeper review publication
    needs: seal
    if: needs.seal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve immutable automation bot identity
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          identity="$(curl --globoff --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/users/${APP_SLUG}[bot]")"
          echo "login=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).login))')" >> "$GITHUB_OUTPUT"
          echo "id=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).id))')" >> "$GITHUB_OUTPUT"

      - name: Download bootstrap Codekeeper tooling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-tooling-${{ github.run_id }}
          path: ${{ github.workspace }}
      - name: Verify bootstrap Codekeeper tooling against pinned manifest
        env:
          TOOLING_ROOT: ${{ github.workspace }}/tooling/tools/codekeeper
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { lstat, readFile } from "node:fs/promises"; import { join } from "node:path";
            const root = process.env.TOOLING_ROOT;
            const expected = process.env.CODEKEEPER_TOOLING_MANIFEST_SHA256;
            const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const regular = async (file, label) => {
              const stat = await lstat(file);
              if (!stat.isFile()) throw new Error("Codekeeper tooling integrity bootstrap rejected " + label);
              return readFile(file);
            };
            const manifest = await regular(join(root, "tooling-manifest.json"), "manifest");
            if (digest(manifest) !== expected) throw new Error("Codekeeper tooling manifest does not match the pinned workflow");
            const files = JSON.parse(manifest).files;
            const verifier = Array.isArray(files) && files.find((entry) => entry?.path === "scripts/verify-tooling-artifact.mjs");
            if (!verifier || !/^[0-9a-f]{64}$/.test(verifier.sha256)) throw new Error("Codekeeper tooling manifest lacks its verifier");
            const verifierBytes = await regular(join(root, "scripts", "verify-tooling-artifact.mjs"), "verifier");
            if (digest(verifierBytes) !== verifier.sha256) throw new Error("Codekeeper tooling verifier does not match the pinned manifest");
          '
          node "$TOOLING_ROOT/scripts/verify-tooling-artifact.mjs" \
            --root "$TOOLING_ROOT" \
            --expected-manifest-sha256 "$CODEKEEPER_TOOLING_MANIFEST_SHA256"

      - name: Check out trusted default-branch configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Download sealed review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-review-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codekeeper-artifact

      - name: Publish sealed review decision
        working-directory: tooling
        env:
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ steps.bot.outputs.login }}
          CODEKEEPER_AUTOMATION_BOT_ID: ${{ steps.bot.outputs.id }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/pr-reviewer.md
          MANIFEST_SHA256: ${{ needs.seal.outputs.manifest_sha256 }}
        run: |
          node tools/codekeeper/src/cli.mjs publish-review \
            --config "$CONFIG" \
            --agent-profile "$AGENT_PROFILE" \
            --artifact "$RUNNER_TEMP/codekeeper-artifact" \
            --expected-manifest-sha "$MANIFEST_SHA256"

  gate:
    name: Codekeeper review gate
    if: always()
    needs: [analyze, seal, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless a current review was published
        env:
          ENABLED: ${{ inputs.enabled }}
          AUTO_REVIEW: ${{ inputs.auto_review }}
          AUTO_REVIEW_FEEDBACK: ${{ inputs.feedback_triage }}
          IS_REVIEW_FEEDBACK: ${{ github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || (github.event_name == 'repository_dispatch' && github.event.client_payload.review_feedback) }}
          IS_COMMAND_REVIEW: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'codekeeper_review' }}
          IS_OWNER_COMMAND_REVIEW: ${{ inputs.owner_command }}
          IS_DRAFT: ${{ github.event.pull_request.draft || github.event.client_payload.draft }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.event.client_payload.head_repository }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.client_payload.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.actor }}
          AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          SEAL_RESULT: ${{ needs.seal.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          [[ "$IS_REVIEW_FEEDBACK" == "true" && -n "$AUTOMATION_BOT_LOGIN" && "$ACTOR" == "$AUTOMATION_BOT_LOGIN" ]] && {
            echo "Codekeeper-authored review feedback is intentionally ignored."
            exit 0
          }
          [[ "$IS_OWNER_COMMAND_REVIEW" == "true" ]] && {
            echo "Owner review command is intentionally routed by the repository assistant."
            exit 0
          }
          [[ "$ENABLED" == "true" ]] || { echo "Codekeeper is disabled; this required gate fails closed."; exit 1; }
          [[ "$IS_COMMAND_REVIEW" == "true" || ("$IS_REVIEW_FEEDBACK" == "true" && "$AUTO_REVIEW_FEEDBACK" == "true") || ("$IS_REVIEW_FEEDBACK" != "true" && "$AUTO_REVIEW" == "true") ]] || { echo "The matching automatic review policy is disabled; this required gate fails closed."; exit 1; }
          [[ "$IS_DRAFT" != "true" ]] || { echo "Draft pull requests require manual review."; exit 1; }
          [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] || { echo "Fork pull requests require manual review."; exit 1; }
          [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]] || { echo "Only default-branch pull request targets are supported."; exit 1; }
          [[ "$ANALYZE_RESULT" == "success" && "$SEAL_RESULT" == "success" && "$PUBLISH_RESULT" == "success" ]] || {
            echo "Codekeeper did not publish a passing current review."
            exit 1
          }
