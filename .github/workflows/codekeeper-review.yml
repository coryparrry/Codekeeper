name: Codekeeper review

# Forks and merge queues remain unsupported. Drafts may produce a sealed manual
# result, and same-repository stacked PRs may receive a report. Labels, repair,
# deferred issues, and auto-merge remain limited to non-draft same-repository PRs
# targeting the configured default branch. merge_group does not provide the
# single-PR head/base contract required by the sealed publication guard.
on:
  workflow_call:
    inputs:
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      enabled:
        description: Run the AI review. false intentionally fails the required gate.
        required: false
        default: true
        type: boolean
      auto_review:
        description: Automatically review eligible pull request events.
        required: false
        default: true
        type: boolean
      feedback_triage:
        description: Automatically triage pull request reviews and review comments.
        required: false
        default: true
        type: boolean
      owner_command:
        description: Compatibility input for callers that already classified an owner command.
        required: false
        default: false
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login, used only to admit its own PRs.
        required: false
        default: ""
        type: string
      app_client_id:
        description: GitHub App client ID. This identifier is not secret.
        required: true
        type: string
      app_contents_permission:
        description: GitHub App Contents permission requested by this workflow.
        required: false
        default: read
        type: string
      app_issues_permission:
        description: GitHub App Issues permission requested by this workflow.
        required: false
        default: write
        type: string
      app_pull_requests_permission:
        description: GitHub App Pull requests permission requested by this workflow.
        required: false
        default: write
        type: string
    secrets:
      model_api_key:
        description: API key for the provider selected by ai.agents.review.provider.
        required: true
      workspace_api_key:
        description: OpenAI API key for the optional Codex workspace specialist.
        required: false
      openai_api_key:
        description: Deprecated compatibility fallback for the Codex workspace specialist only.
        required: false
      trace_api_key:
        description: Dedicated OpenAI API key used only for trace export.
        required: false
      app_private_key:
        required: true

permissions:
  contents: read

env:
  CODEKEEPER_PACKAGE_NAME: codekeeper
  CODEKEEPER_PACKAGE_VERSION: ${{ inputs.package_version }}
  CODEKEEPER_PACKAGE_INTEGRITY: ${{ inputs.package_integrity }}

concurrency:
  group: codekeeper-review-${{ github.event.pull_request.number || github.event.client_payload.number }}
  cancel-in-progress: ${{ github.actor != inputs.automation_bot_login }}

jobs:
  analyze:
    name: Codekeeper review analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      route: ${{ steps.intent.outputs.route }}
      owner_command: ${{ steps.intent.outputs.owner_command }}
      execute: ${{ steps.intent.outputs.execute }}
      candidate_sha256: ${{ steps.validate.outputs.candidate_sha256 }}
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
      package_manifest_sha256: ${{ steps.codekeeper-package.outputs.package_manifest_sha256 }}
      package_source_commit: ${{ steps.codekeeper-package.outputs.source_commit }}
    steps:
      - name: Detect Codekeeper review intent
        id: intent
        env:
          ENABLED: ${{ inputs.enabled }}
          AUTO_REVIEW: ${{ inputs.auto_review }}
          FEEDBACK_TRIAGE: ${{ inputs.feedback_triage }}
          OWNER_COMMAND: ${{ inputs.owner_command }}
          AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const eventName = String(process.env.GITHUB_EVENT_NAME ?? "");
            const repository = String(process.env.GITHUB_REPOSITORY ?? "");
            const actor = String(process.env.GITHUB_ACTOR ?? "").toLowerCase();
            const automationBot = String(process.env.AUTOMATION_BOT_LOGIN ?? "").toLowerCase();
            const body = String(event.comment?.body ?? "").trim();
            const commentAuthor = String(event.comment?.user?.login ?? "").toLowerCase();
            const reviewAuthor = String(event.review?.user?.login ?? "").toLowerCase();
            const author = eventName === "pull_request_review" ? reviewAuthor : commentAuthor;
            const association = String(event.comment?.author_association ?? "");
            const mentionBot = automationBot.replace(/\[bot\]$/i, "");
            const escapedMention = mentionBot.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            // CODEKEEPER_OWNER_COMMANDS_START
            const actions = ["help","status","review","rerun","triage","implement","repair","fix","defer","pause","stop"];
            // CODEKEEPER_OWNER_COMMANDS_END
            const slash = new RegExp(`^/codekeeper\\s+(${actions.join("|")})$`, "i").test(body);
            const mentioned = Boolean(mentionBot && new RegExp(`^@${escapedMention}\\s+(${actions.join("|")})$`, "i").test(body));
            const trustedAssociation = ["OWNER", "MEMBER", "COLLABORATOR"].includes(association);
            const classifiedOwnerCommand = process.env.OWNER_COMMAND === "true";
            const commandIntent = Boolean(classifiedOwnerCommand || (
              eventName === "pull_request_review_comment" && trustedAssociation && (slash || mentioned)
            ));
            const feedbackEvent = eventName === "pull_request_review" || eventName === "pull_request_review_comment";
            const automationReply = Boolean(feedbackEvent && automationBot && author === automationBot);
            const route = (!feedbackEvent || Boolean(automationBot)) && !commandIntent && !automationReply;
            const dispatch = eventName === "repository_dispatch"
              && event.action === "codekeeper_review"
              && Boolean(automationBot)
              && actor === automationBot;
            const sameRepository = event.pull_request?.head?.repo?.full_name === repository
              && event.pull_request?.base?.repo?.full_name === repository;
            const automatic = process.env.AUTO_REVIEW === "true" && eventName === "pull_request_target";
            const feedback = process.env.FEEDBACK_TRIAGE === "true"
              && Boolean(automationBot)
              && actor !== automationBot
              && feedbackEvent;
            const eligible = dispatch || ((automatic || feedback) && sameRepository);
            const execute = process.env.ENABLED === "true" && route && eligible;
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `owner_command=${commandIntent}\nroute=${route}\nexecute=${execute}\n`,
            );
          '

      - name: Check out trusted default-branch configuration
        if: steps.intent.outputs.execute == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          sparse-checkout: |
            .github/codekeeper.json
            .github/codekeeper/agents/pr-reviewer.md
            .github/codekeeper/actions/acquire-package
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out exact pull request head
        if: steps.intent.outputs.execute == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha }}
          fetch-depth: 0
          path: worktree
          persist-credentials: false

      - name: Set up pinned Node.js
        if: steps.intent.outputs.execute == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Acquire exact Codekeeper package
        if: steps.intent.outputs.execute == 'true'
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}

      - name: Install exact Codekeeper runtime
        if: steps.intent.outputs.execute == 'true'
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"

      - name: Prepare one frozen review bundle
        if: steps.intent.outputs.execute == 'true'
        id: prepare
        working-directory: worktree
        env:
          CODEKEEPER_TOOLING_SHA: ${{ steps.codekeeper-package.outputs.source_commit }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CONFIG: ${{ github.workspace }}/codekeeper-config.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/pr-reviewer.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
        run: |
          [[ ! -e "$CONFIG" ]] || { echo "Frozen config already exists"; exit 1; }
          cp "$SOURCE_CONFIG" "$CONFIG"
          [[ "$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).repository.defaultBranch)' "$CONFIG")" == "$DEFAULT_BRANCH" ]] || {
            echo "Configured default branch does not match the repository default branch"
            exit 1
          }
          node ../tooling/codekeeper-runtime/src/cli.mjs prepare-review \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$(git -C "$GITHUB_WORKSPACE/repository" rev-parse HEAD)" \
            --event "$GITHUB_EVENT_PATH" \
            --tooling-sha "$CODEKEEPER_TOOLING_SHA"
          echo "context_sha256=$(sha256sum "$BUNDLE/context.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Resolve review agent settings
        if: steps.intent.outputs.execute == 'true'
        id: settings
        working-directory: worktree
        env:
          CONFIG: ${{ github.workspace }}/codekeeper-config.json
        run: |
          node ../tooling/codekeeper-runtime/src/cli.mjs agent-settings \
            --config "$CONFIG" \
            --mode review

      - name: Require optional workspace specialist key
        if: steps.intent.outputs.execute == 'true' && steps.settings.outputs.workspace_enabled == 'true'
        env:
          WORKSPACE_API_KEY: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
        run: |
          test -n "$WORKSPACE_API_KEY" || {
            echo "workspace_api_key is required because ai.agents.review.workspace.enabled=true"
            exit 1
          }

      - name: Isolate the workspace specialist from later credentials
        if: steps.intent.outputs.execute == 'true' && steps.settings.outputs.workspace_enabled == 'true'
        working-directory: worktree
        env:
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CODEX_HOME: ${{ github.workspace }}/codekeeper-codex-home
          CONFIG: ${{ github.workspace }}/codekeeper-config.json
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
          REPOSITORY_PATH: ${{ github.workspace }}/worktree
          TOOLING_PATH: ${{ github.workspace }}/tooling
          WORKSPACE_TEMP: ${{ github.workspace }}/codekeeper-workspace-tmp
          WORKSPACE_USER: codekeeper-workspace
        run: |
          set -euo pipefail
          test ! -e "$CODEX_HOME" || { echo "Isolated Codex home already exists"; exit 1; }
          test ! -e "$WORKSPACE_TEMP" || { echo "Workspace temporary directory already exists"; exit 1; }
          test ! -e "$QUARANTINE" || { echo "Repository skill quarantine already exists"; exit 1; }
          test ! -L .agents || { echo "Refusing symlinked .agents instruction root"; exit 1; }
          test ! -L .codex || { echo "Refusing symlinked .codex instruction root"; exit 1; }
          ! id -u "$WORKSPACE_USER" >/dev/null 2>&1 || { echo "Workspace account already exists"; exit 1; }
          sudo useradd --system --no-create-home --user-group --shell /usr/sbin/nologin "$WORKSPACE_USER"
          install -d -m 700 "$CODEX_HOME" "$WORKSPACE_TEMP" "$QUARANTINE"
          chmod a+x,go-w "$GITHUB_WORKSPACE"
          chmod -R a+rX,go-w "$REPOSITORY_PATH" "$BUNDLE" "$TOOLING_PATH"
          chmod a+r,go-w "$CONFIG"
          install -m 600 /dev/null "$BUNDLE/workspace-result.json"
          install -m 600 /dev/null "$BUNDLE/workspace-runtime-metadata.json"
          {
            echo '[safe]'
            printf '\tdirectory = %s\n' "$REPOSITORY_PATH"
          } > "$CODEX_HOME/.gitconfig"
          chmod 600 "$CODEX_HOME/.gitconfig"
          {
            echo 'project_doc_max_bytes = 0'
            echo 'project_doc_fallback_filenames = []'
            echo
            echo '[skills]'
            echo 'include_instructions = false'
            echo 'bundled = { enabled = false }'
            echo
            echo '[shell_environment_policy]'
            echo 'inherit = "core"'
            echo 'ignore_default_excludes = false'
            echo
            printf '[projects.%s]\n' "$(node -p 'JSON.stringify(process.env.REPOSITORY_PATH)')"
            echo 'trust_level = "untrusted"'
          } > "$CODEX_HOME/config.toml"
          for surface in .agents/skills .codex/skills; do
            if [ -e "$surface" ] || [ -L "$surface" ]; then
              mkdir -p "$QUARANTINE/$(dirname "$surface")"
              mv -- "$surface" "$QUARANTINE/$surface"
            fi
          done
          sudo chown -R "$WORKSPACE_USER:$WORKSPACE_USER" "$CODEX_HOME" "$WORKSPACE_TEMP"
          sudo chown "$WORKSPACE_USER:$WORKSPACE_USER" \
            "$BUNDLE/workspace-result.json" \
            "$BUNDLE/workspace-runtime-metadata.json"
          sudo --user "$WORKSPACE_USER" -- test -r "$TOOLING_PATH/codekeeper-runtime/src/cli.mjs"

      - name: Review with isolated Codex through the Agents SDK
        if: steps.intent.outputs.execute == 'true' && steps.settings.outputs.workspace_enabled == 'true'
        working-directory: worktree
        env:
          CODEKEEPER_WORKSPACE_API_KEY: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CODEX_HOME: ${{ github.workspace }}/codekeeper-codex-home
          CONFIG: ${{ github.workspace }}/codekeeper-config.json
          WORKSPACE_TEMP: ${{ github.workspace }}/codekeeper-workspace-tmp
          WORKSPACE_USER: codekeeper-workspace
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          sudo --user "$WORKSPACE_USER" -- env -i \
            CI=true \
            HOME="$CODEX_HOME" \
            LANG="${LANG:-C.UTF-8}" \
            PATH="$(dirname "$NODE_BIN"):/usr/local/bin:/usr/bin:/bin" \
            SHELL=/bin/bash \
            USER="$WORKSPACE_USER" \
            LOGNAME="$WORKSPACE_USER" \
            TMPDIR="$WORKSPACE_TEMP" \
            CODEX_HOME="$CODEX_HOME" \
            CODEKEEPER_WORKSPACE_API_KEY="$CODEKEEPER_WORKSPACE_API_KEY" \
            "$NODE_BIN" "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" run-workspace-agent \
              --config "$CONFIG" \
              --directory "$BUNDLE" \
              --mode review \
              --result "$BUNDLE/workspace-result.json"

      - name: Close the workspace isolation boundary
        if: always() && steps.intent.outputs.execute == 'true' && steps.settings.outputs.workspace_enabled == 'true'
        working-directory: worktree
        env:
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CODEX_HOME: ${{ github.workspace }}/codekeeper-codex-home
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
          WORKSPACE_TEMP: ${{ github.workspace }}/codekeeper-workspace-tmp
          WORKSPACE_USER: codekeeper-workspace
        run: |
          set -euo pipefail
          if id -u "$WORKSPACE_USER" >/dev/null 2>&1; then
            sudo pkill -TERM -u "$WORKSPACE_USER" >/dev/null 2>&1 || true
            for _ in $(seq 1 20); do
              pgrep -u "$WORKSPACE_USER" >/dev/null 2>&1 || break
              sleep 0.1
            done
            sudo pkill -KILL -u "$WORKSPACE_USER" >/dev/null 2>&1 || true
            ! pgrep -u "$WORKSPACE_USER" >/dev/null 2>&1 || {
              echo "Isolated workspace process survived cleanup"
              exit 1
            }
            for evidence in "$BUNDLE/workspace-result.json" "$BUNDLE/workspace-runtime-metadata.json"; do
              test -f "$evidence" && test ! -L "$evidence" || {
                echo "Isolated workspace evidence is not a regular file"
                exit 1
              }
            done
            sudo chown "$(id -u):$(id -g)" \
              "$BUNDLE/workspace-result.json" \
              "$BUNDLE/workspace-runtime-metadata.json"
            sudo rm -rf "$CODEX_HOME" "$WORKSPACE_TEMP"
            sudo userdel "$WORKSPACE_USER"
          fi
          contaminated=false
          for surface in .agents/skills .codex/skills; do
            if [ -e "$surface" ] || [ -L "$surface" ]; then
              mkdir -p "$QUARANTINE/generated/$(dirname "$surface")"
              mv -- "$surface" "$QUARANTINE/generated/$surface"
              contaminated=true
            fi
            if [ -e "$QUARANTINE/$surface" ] || [ -L "$QUARANTINE/$surface" ]; then
              chmod u+w "$(dirname "$surface")" 2>/dev/null || true
              mkdir -p "$(dirname "$surface")"
              mv -- "$QUARANTINE/$surface" "$surface"
            fi
          done
          [ "$contaminated" = false ] || { echo "Codex created a quarantined instruction surface"; exit 1; }

      - name: Verify the frozen context survived workspace inspection
        if: steps.intent.outputs.execute == 'true'
        env:
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          EXPECTED_CONTEXT_SHA256: ${{ steps.prepare.outputs.context_sha256 }}
        run: |
          test -n "$EXPECTED_CONTEXT_SHA256" || { echo "Frozen context digest is missing"; exit 1; }
          ACTUAL_CONTEXT_SHA256="$(sha256sum "$BUNDLE/context.json" | awk '{print $1}')"
          [[ "$ACTUAL_CONTEXT_SHA256" == "$EXPECTED_CONTEXT_SHA256" ]] || {
            echo "Workspace inspection changed the frozen review context"
            exit 1
          }

      - name: Finalize review with configured Agents SDK model
        if: steps.intent.outputs.execute == 'true'
        working-directory: worktree
        env:
          CODEKEEPER_MODEL_API_KEY: ${{ secrets.model_api_key }}
          CODEKEEPER_TRACE_API_KEY: ${{ secrets.trace_api_key }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CONFIG: ${{ github.workspace }}/codekeeper-config.json
        run: |
          node ../tooling/codekeeper-runtime/src/cli.mjs run-agent \
            --config "$CONFIG" \
            --mode review \
            --directory "$BUNDLE" \
            --workspace-result "$BUNDLE/workspace-result.json" \
            --result "$BUNDLE/agent-result.json"

      - name: Validate untrusted review candidate
        if: steps.intent.outputs.execute == 'true'
        id: validate
        working-directory: worktree
        env:
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CANDIDATE: ${{ github.workspace }}/codekeeper-private/candidate
          CONFIG: ${{ github.workspace }}/codekeeper-config.json
        run: |
          PRIVATE_ROOT="$(dirname "$CANDIDATE")"
          test ! -e "$PRIVATE_ROOT" || { echo "Coordinator output directory already exists"; exit 1; }
          install -d -m 700 "$PRIVATE_ROOT"
          node ../tooling/codekeeper-runtime/src/cli.mjs validate-review \
            --config "$CONFIG" \
            --directory "$BUNDLE" \
            --context "$BUNDLE/context.json" \
            --result "$BUNDLE/agent-result.json" \
            --artifact "$CANDIDATE"

      - name: Stage one review publication handoff
        if: steps.intent.outputs.execute == 'true'
        env:
          CANDIDATE: ${{ github.workspace }}/codekeeper-private/candidate
          HANDOFF: ${{ github.workspace }}/codekeeper-private/handoff
        run: |
          test ! -e "$HANDOFF" || { echo "Review handoff already exists"; exit 1; }
          install -d -m 700 "$(dirname "$HANDOFF")"
          mkdir -p "$HANDOFF/tooling"
          mv "$GITHUB_WORKSPACE/tooling/tools" "$HANDOFF/tooling/tools"
          mv "$CANDIDATE" "$HANDOFF/candidate"

      - name: Upload review publication handoff
        if: steps.intent.outputs.execute == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-review-publication-${{ github.run_id }}
          path: ${{ github.workspace }}/codekeeper-private/handoff
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  gate:
    name: Codekeeper review gate
    needs: analyze
    if: always() && needs.analyze.outputs.route != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate GitHub App permission inputs
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        env:
          APP_CONTENTS_PERMISSION: ${{ inputs.app_contents_permission }}
          APP_ISSUES_PERMISSION: ${{ inputs.app_issues_permission }}
          APP_PULL_REQUESTS_PERMISSION: ${{ inputs.app_pull_requests_permission }}
        run: |
          for permission in "$APP_CONTENTS_PERMISSION" "$APP_ISSUES_PERMISSION" "$APP_PULL_REQUESTS_PERMISSION"; do
            case "$permission" in
              read|write) ;;
              *) echo "Invalid GitHub App permission: $permission"; exit 1 ;;
            esac
          done

      - name: Download review publication handoff
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-review-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-review-handoff

      - name: Restore verified package and candidate
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        env:
          HANDOFF: ${{ runner.temp }}/codekeeper-review-handoff
        run: |
          test -d "$HANDOFF/tooling/tools/codekeeper" || { echo "Review handoff is missing verified tooling"; exit 1; }
          test -d "$HANDOFF/candidate" || { echo "Review handoff is missing the candidate"; exit 1; }
          test ! -e "$GITHUB_WORKSPACE/tooling" || { echo "Tooling path already exists"; exit 1; }
          mv "$HANDOFF/tooling" "$GITHUB_WORKSPACE/tooling"

      - name: Check out trusted default-branch configuration
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          sparse-checkout: |
            .github/codekeeper.json
            .github/codekeeper/agents/pr-reviewer.md
            .github/codekeeper/actions/acquire-package
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up pinned Node.js
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Verify downloaded Codekeeper package
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_source: artifact
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}
          expected_manifest_sha256: ${{ needs.analyze.outputs.package_manifest_sha256 }}
          expected_source_commit: ${{ needs.analyze.outputs.package_source_commit }}

      - name: Install exact Codekeeper runtime
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"

      - name: Seal review artifact without repository execution
        if: needs.analyze.result == 'success' && needs.analyze.outputs.execute == 'true'
        id: seal
        env:
          CANDIDATE: ${{ runner.temp }}/codekeeper-review-handoff/candidate
          ARTIFACT: ${{ runner.temp }}/codekeeper-artifact
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          CANDIDATE_SHA256: ${{ needs.analyze.outputs.candidate_sha256 }}
          CONTEXT_SHA256: ${{ needs.analyze.outputs.context_sha256 }}
        run: |
          node tooling/codekeeper-runtime/src/cli.mjs seal-review \
            --config "$CONFIG" \
            --candidate "$CANDIDATE" \
            --artifact "$ARTIFACT" \
            --expected-candidate-sha "$CANDIDATE_SHA256" \
            --expected-context-sha "$CONTEXT_SHA256"

      - name: Create short-lived GitHub App token
        if: steps.seal.outcome == 'success'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: ${{ inputs.app_contents_permission }}
          permission-issues: ${{ inputs.app_issues_permission }}
          permission-pull-requests: ${{ inputs.app_pull_requests_permission }}

      - name: Resolve immutable automation bot identity
        if: steps.seal.outcome == 'success'
        id: bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          identity="$(curl --globoff --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/users/${APP_SLUG}[bot]")"
          echo "login=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).login))')" >> "$GITHUB_OUTPUT"
          echo "id=$(printf '%s' "$identity" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).id))')" >> "$GITHUB_OUTPUT"

      - name: Publish sealed review decision
        if: steps.seal.outcome == 'success'
        id: publish
        working-directory: tooling
        env:
          CODEKEEPER_TOOLING_SHA: ${{ needs.analyze.outputs.package_source_commit }}
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ steps.bot.outputs.login }}
          CODEKEEPER_AUTOMATION_BOT_ID: ${{ steps.bot.outputs.id }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          AGENT_PROFILE: ${{ github.workspace }}/repository/.github/codekeeper/agents/pr-reviewer.md
          MANIFEST_SHA256: ${{ steps.seal.outputs.manifest_sha256 }}
        run: |
          node codekeeper-runtime/src/cli.mjs publish-review \
            --config "$CONFIG" \
            --agent-profile "$AGENT_PROFILE" \
            --agent-profile-source-sha "$(git -C "$GITHUB_WORKSPACE/repository" rev-parse HEAD)" \
            --artifact "$RUNNER_TEMP/codekeeper-artifact" \
            --expected-manifest-sha "$MANIFEST_SHA256"

      - name: Fail closed unless a current review was published
        if: always()
        env:
          ENABLED: ${{ inputs.enabled }}
          AUTO_REVIEW: ${{ inputs.auto_review }}
          AUTO_REVIEW_FEEDBACK: ${{ inputs.feedback_triage }}
          IS_AUTOMATION_REPLY: ${{ github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == inputs.automation_bot_login }}
          IS_REVIEW_FEEDBACK: ${{ github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || (github.event_name == 'repository_dispatch' && github.event.client_payload.review_feedback) }}
          IS_COMMAND_REVIEW: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'codekeeper_review' }}
          IS_OWNER_COMMAND_REVIEW: ${{ needs.analyze.outputs.owner_command }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.event.client_payload.head_repository }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.client_payload.base_sha }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.client_payload.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.actor }}
          AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          SEAL_RESULT: ${{ steps.seal.outcome }}
          PUBLISH_DISPOSITION: ${{ steps.publish.outputs.result != '' && fromJSON(steps.publish.outputs.result).disposition || '' }}
          PUBLISH_BLOCKING: ${{ steps.publish.outputs.result != '' && fromJSON(steps.publish.outputs.result).blocking || false }}
        run: |
          [[ "$IS_AUTOMATION_REPLY" == "true" || ("$IS_REVIEW_FEEDBACK" == "true" && -n "$AUTOMATION_BOT_LOGIN" && "$ACTOR" == "$AUTOMATION_BOT_LOGIN") ]] && {
            echo "Codekeeper-authored review feedback is intentionally ignored."
            exit 0
          }
          [[ "$IS_OWNER_COMMAND_REVIEW" == "true" ]] && {
            echo "Owner review commands must be routed by the repository assistant, not the required review gate."
            exit 1
          }
          [[ "$ENABLED" == "true" ]] || { echo "Codekeeper is disabled; this required gate fails closed."; exit 1; }
          [[ "$IS_COMMAND_REVIEW" == "true" || ("$IS_REVIEW_FEEDBACK" == "true" && "$AUTO_REVIEW_FEEDBACK" == "true") || ("$IS_REVIEW_FEEDBACK" != "true" && "$AUTO_REVIEW" == "true") ]] || { echo "The matching automatic review policy is disabled; this required gate fails closed."; exit 1; }
          manual_review() {
            echo "::notice title=Codekeeper manual review::$1"
            printf '## Codekeeper manual review\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [[ "$BASE_REPOSITORY" == "$REPOSITORY" && "$HEAD_REPOSITORY" == "$REPOSITORY" ]] || {
            echo "Fork pull requests are unsupported; manual review is required."
            exit 1
          }
          [[ "$ANALYZE_RESULT" == "success" && "$SEAL_RESULT" == "success" ]] || {
            echo "Codekeeper did not seal a current review."
            exit 1
          }
          case "$PUBLISH_DISPOSITION" in
            published)
              [[ "$PUBLISH_BLOCKING" != "true" ]] || {
                echo "Codekeeper published blocking findings for the current pull request head."
                exit 1
              }
              if [[ "$BASE_REF" != "$DEFAULT_BRANCH" ]]; then
                echo "Stacked pull request target $BASE_REF is review-publication-only; automatic repair and auto-merge remain restricted to $DEFAULT_BRANCH."
              fi
              ;;
            manual)
              manual_review "The sealed publication step rechecked the live pull request and returned a manual-review disposition without mutation."
              ;;
            unsupported)
              manual_review "The sealed publication step rechecked the live pull request and returned an unsupported disposition without mutation."
              ;;
            *)
              echo "Codekeeper did not produce a sealed live review disposition."
              exit 1
              ;;
          esac
