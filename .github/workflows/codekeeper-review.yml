name: Codekeeper review

# Compatibility wrapper. Existing callers retain their public inputs while the
# verified generic runtime owns execution and derives App permissions.
# Forks and merge queues remain unsupported. Drafts may produce a sealed manual
# result, and same-repository stacked pull requests may receive a report.
# merge_group lacks the single-head contract required by the publication guard.
on:
  workflow_call:
    inputs:
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      enabled:
        description: Run the AI review. false intentionally fails the required gate.
        required: false
        default: true
        type: boolean
      auto_review:
        description: Automatically review eligible pull request events.
        required: false
        default: true
        type: boolean
      feedback_triage:
        description: Automatically triage pull request reviews and review comments.
        required: false
        default: true
        type: boolean
      owner_command:
        description: Compatibility input for callers that already classified an owner command.
        required: false
        default: false
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login, used only to admit its own PRs.
        required: false
        default: ""
        type: string
      app_client_id:
        description: GitHub App client ID. This identifier is not secret.
        required: true
        type: string
      app_contents_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: read
        type: string
      app_issues_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: write
        type: string
      app_pull_requests_permission:
        description: Deprecated compatibility input; permissions come from the verified mode plan.
        required: false
        default: write
        type: string
    secrets:
      model_api_key:
        description: API key for the provider selected by ai.agents.review.provider.
        required: true
      workspace_api_key:
        description: OpenAI API key for the optional Codex workspace specialist.
        required: false
      openai_api_key:
        description: Deprecated compatibility fallback for the Codex workspace specialist only.
        required: false
      trace_api_key:
        description: Dedicated OpenAI API key used only for trace export.
        required: false
      app_private_key:
        required: true

permissions:
  contents: read

concurrency:
  group: codekeeper-review-${{ github.event.pull_request.number || github.event.client_payload.number }}
  cancel-in-progress: ${{ github.actor != inputs.automation_bot_login }}

jobs:
  runtime:
    # Owner commands are routed by the assistant workflow and intentionally do
    # not create a second review check. Ordinary review events enter the
    # generic runtime, which fails the required gate closed when ineligible.
    # CODEKEEPER_OWNER_COMMANDS_START
    if: >-
      !inputs.owner_command &&
      !(
        (github.event_name == 'pull_request_review' ||
         github.event_name == 'pull_request_review_comment') &&
        (
          inputs.automation_bot_login == '' ||
          github.event.review.user.login == inputs.automation_bot_login ||
          github.event.comment.user.login == inputs.automation_bot_login
        )
      ) &&
      !(
        github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          contains(fromJSON('["/codekeeper help","/codekeeper status","/codekeeper review","/codekeeper rerun","/codekeeper triage","/codekeeper implement","/codekeeper repair","/codekeeper fix","/codekeeper defer","/codekeeper pause","/codekeeper stop"]'), github.event.comment.body) ||
          (
            startsWith(github.event.comment.body, '@') &&
            (endsWith(github.event.comment.body, ' help') ||
             endsWith(github.event.comment.body, ' status') ||
             endsWith(github.event.comment.body, ' review') ||
             endsWith(github.event.comment.body, ' rerun') ||
             endsWith(github.event.comment.body, ' triage') ||
             endsWith(github.event.comment.body, ' implement') ||
             endsWith(github.event.comment.body, ' repair') ||
             endsWith(github.event.comment.body, ' fix') ||
             endsWith(github.event.comment.body, ' defer') ||
             endsWith(github.event.comment.body, ' pause') ||
             endsWith(github.event.comment.body, ' stop'))
          )
        )
      )
    # CODEKEEPER_OWNER_COMMANDS_END
    uses: ./.github/workflows/codekeeper-runtime.yml
    with:
      mode: review
      package_version: ${{ inputs.package_version }}
      package_integrity: ${{ inputs.package_integrity }}
      enabled: >-
        ${{
          inputs.enabled &&
          (
            (
              github.event_name == 'repository_dispatch' &&
              github.event.action == 'codekeeper_review' &&
              inputs.automation_bot_login != '' &&
              github.actor == inputs.automation_bot_login
            ) ||
            (
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.base.repo.full_name == github.repository &&
              (
                (inputs.auto_review && github.event_name == 'pull_request_target') ||
                (
                  inputs.feedback_triage &&
                  inputs.automation_bot_login != '' &&
                  github.actor != inputs.automation_bot_login &&
                  (
                    github.event_name == 'pull_request_review' ||
                    github.event_name == 'pull_request_review_comment'
                  ) &&
                  github.event.review.user.login != inputs.automation_bot_login &&
                  github.event.comment.user.login != inputs.automation_bot_login
                )
              )
            )
          )
        }}
      dry_run: false
      automation_bot_login: ${{ inputs.automation_bot_login }}
      app_client_id: ${{ inputs.app_client_id }}
    secrets:
      model_api_key: ${{ secrets.model_api_key }}
      workspace_api_key: ${{ secrets.workspace_api_key || secrets.openai_api_key }}
      trace_api_key: ${{ secrets.trace_api_key }}
      app_private_key: ${{ secrets.app_private_key }}
