name: Prepare Rivet release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rivet-release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository with the release token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          persist-credentials: true
      - name: Open or update the reviewed release pull request
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out the fixed same-repository release pull request
        if: steps.release-please.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/release-please--branches--main--components--rivet:refs/remotes/origin/release-please--branches--main--components--rivet'
          git switch --create release-please--branches--main--components--rivet \
            --track refs/remotes/origin/release-please--branches--main--components--rivet
          test "$(git branch --show-current)" = release-please--branches--main--components--rivet
      - name: Refresh the exact tracked source manifest
        if: steps.release-please.outputs.prs_created == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/refresh-release-manifest.mjs
      - name: Verify release pull request branch remains the only changed ref
        if: steps.release-please.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = release-please--branches--main--components--rivet
          test "$(git status --porcelain=v1 --untracked-files=all)" = ""
          git push origin HEAD:refs/heads/release-please--branches--main--components--rivet
