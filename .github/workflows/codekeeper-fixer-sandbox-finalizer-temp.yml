name: Finalize Codekeeper Fixer sandbox compatibility

on:
  push:
    branches:
      - fix/codex-sandbox-prerequisites

permissions:
  contents: write

concurrency:
  group: finalize-codekeeper-fixer-sandbox
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/codex-sandbox-prerequisites
          fetch-depth: 0
          persist-credentials: true
      - name: Apply sandbox prerequisite repair and regression contracts
        env:
          HEAD_BRANCH: fix/codex-sandbox-prerequisites
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 <<'PY'
          from pathlib import Path

          isolation_path = Path("tools/codekeeper/src/lib/orchestration/workspace-isolation.mjs")
          isolation = isolation_path.read_text()
          old_header = '''const exec = promisify(execFile);
          const INSTRUCTION_SURFACES = [".agents/skills", ".codex/skills"];
          '''
          new_header = '''const exec = promisify(execFile);
          const INSTRUCTION_SURFACES = [".agents/skills", ".codex/skills"];
          const CODEX_SANDBOX_SYSCTLS = Object.freeze([
            ["kernel.unprivileged_userns_clone", "1"],
            ["kernel.apparmor_restrict_unprivileged_userns", "0"],
          ]);

          function isGitHubHostedLinux(environment, platform) {
            return (
              platform === "linux" &&
              environment.GITHUB_ACTIONS === "true" &&
              environment.RUNNER_OS === "Linux" &&
              environment.RUNNER_ENVIRONMENT === "github-hosted"
            );
          }

          async function readSysctl(name, execute) {
            try {
              const { stdout } = await execute("sysctl", ["-n", name]);
              return String(stdout ?? "").trim();
            } catch (error) {
              if (error?.code === 1) return "";
              throw error;
            }
          }

          export async function prepareCodexLinuxSandbox({
            environment = process.env,
            platform = process.platform,
            execute = exec,
          } = {}) {
            if (!isGitHubHostedLinux(environment, platform)) return { changed: [] };
            const changed = [];
            for (const [name, expected] of CODEX_SANDBOX_SYSCTLS) {
              const current = await readSysctl(name, execute);
              if (!current || current === expected) continue;
              await execute("sudo", ["sysctl", "-w", `${name}=${expected}`]);
              changed.push(name);
            }
            return { changed };
          }
          '''
          if isolation.count(old_header) != 1:
              raise SystemExit(f"expected one workspace isolation header, found {isolation.count(old_header)}")
          isolation = isolation.replace(old_header, new_header)
          old_account = '''  let accountCreated = false;
          '''
          new_account = '''  if (workspaceUser) {
            // Current GitHub-hosted Ubuntu images can block Codex's Bubblewrap
            // user namespace before any repository command starts. Enable the
            // same ephemeral-runner prerequisites as OpenAI's codex-action,
            // then retain the normal read-only or workspace-write sandbox.
            await prepareCodexLinuxSandbox();
          }
          let accountCreated = false;
          '''
          if isolation.count(old_account) != 1:
              raise SystemExit(f"expected one workspace account boundary, found {isolation.count(old_account)}")
          isolation_path.write_text(isolation.replace(old_account, new_account))

          schema_path = Path("tools/codekeeper/src/lib/schemas.mjs")
          schema = schema_path.read_text()
          old_result = '''    assertString(test.result, `testsRun[${index}].result`, { maxLength: LIMITS.result });
          '''
          new_result = '''    assertString(test.result, `testsRun[${index}].result`, { maxLength: LIMITS.result });
            assert(
              !/^did not run(?:\\b|:)/i.test(test.result.trim()),
              `testsRun[${index}].result must describe a command that actually ran`,
            );
          '''
          if schema.count(old_result) != 1:
              raise SystemExit(f"expected one fix test-result validator, found {schema.count(old_result)}")
          schema_path.write_text(schema.replace(old_result, new_result))
          PY

          cat > tools/codekeeper/test/workspace-sandbox-prerequisites.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";
          import { getAgentRuntimeSettings } from "../src/lib/config.mjs";
          import { prepareCodexLinuxSandbox } from "../src/lib/orchestration/workspace-isolation.mjs";
          import { validateFixResult } from "../src/lib/schemas.mjs";

          const config = JSON.parse(
            await readFile(new URL("../../../.github/codekeeper.json", import.meta.url), "utf8"),
          );

          const githubHostedLinux = {
            GITHUB_ACTIONS: "true",
            RUNNER_OS: "Linux",
            RUNNER_ENVIRONMENT: "github-hosted",
          };

          test("GitHub-hosted Linux enables Codex Bubblewrap prerequisites while retaining its sandbox", async () => {
            const values = new Map([
              ["kernel.unprivileged_userns_clone", "0"],
              ["kernel.apparmor_restrict_unprivileged_userns", "1"],
            ]);
            const calls = [];
            const execute = async (command, args) => {
              calls.push([command, args]);
              if (command === "sysctl") {
                return { stdout: `${values.get(args[1]) ?? ""}\n` };
              }
              if (command === "sudo") {
                const [name, value] = args[2].split("=");
                values.set(name, value);
                return { stdout: `${args[2]}\n` };
              }
              throw new Error(`Unexpected command: ${command}`);
            };

            const prepared = await prepareCodexLinuxSandbox({
              environment: githubHostedLinux,
              platform: "linux",
              execute,
            });

            assert.deepEqual(prepared.changed, [
              "kernel.unprivileged_userns_clone",
              "kernel.apparmor_restrict_unprivileged_userns",
            ]);
            assert.deepEqual(calls, [
              ["sysctl", ["-n", "kernel.unprivileged_userns_clone"]],
              ["sudo", ["sysctl", "-w", "kernel.unprivileged_userns_clone=1"]],
              ["sysctl", ["-n", "kernel.apparmor_restrict_unprivileged_userns"]],
              ["sudo", ["sysctl", "-w", "kernel.apparmor_restrict_unprivileged_userns=0"]],
            ]);

            const writable = structuredClone(config);
            writable.audit.repair.enabled = true;
            assert.equal(
              getAgentRuntimeSettings(writable, "audit", { mutationAuthorized: true }).workspaceSandbox,
              "workspace-write",
            );
            assert.equal(
              getAgentRuntimeSettings(writable, "fix", { mutationAuthorized: true }).workspaceSandbox,
              "workspace-write",
            );
            assert.equal(getAgentRuntimeSettings(writable, "review").workspaceSandbox, "read-only");
            assert.equal(getAgentRuntimeSettings(writable, "issue").workspaceSandbox, "read-only");
          });

          test("sandbox prerequisite setup is inert outside GitHub-hosted Linux", async () => {
            let executions = 0;
            const prepared = await prepareCodexLinuxSandbox({
              environment: {
                ...githubHostedLinux,
                RUNNER_ENVIRONMENT: "self-hosted",
              },
              platform: "linux",
              execute: async () => {
                executions += 1;
                return { stdout: "" };
              },
            });
            assert.deepEqual(prepared, { changed: [] });
            assert.equal(executions, 0);
          });

          test("Fixer rejects a command receipt for a command that never ran", () => {
            const target = { kind: "issue", number: 63 };
            const result = {
              mode: "fix",
              summary: "The command runtime failed before inspection.",
              risk: "low",
              targetKind: "issue",
              targetNumber: 63,
              changedSummary: "",
              testsRun: [{
                command: "git rev-parse HEAD; git status --short",
                result: "Did not run: sandbox failed before command execution.",
              }],
              resolvedReviewThreadIds: [],
              readyForReview: false,
              noChangeReason: "The execution sandbox did not start.",
            };

            assert.throws(
              () => validateFixResult(structuredClone(result), target),
              /must describe a command that actually ran/,
            );
            result.testsRun[0].result = "exited 1: the deterministic regression test failed";
            assert.doesNotThrow(() => validateFixResult(structuredClone(result), target));
          });
          EOF

          cat > packages/codekeeper/test/fixer-sandbox-release.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          test("packaged Fixer keeps Codex sandboxing usable on GitHub-hosted Ubuntu", async () => {
            const [isolation, config, schemas] = await Promise.all([
              readFile(
                new URL(
                  "../../../tools/codekeeper/src/lib/orchestration/workspace-isolation.mjs",
                  import.meta.url,
                ),
                "utf8",
              ),
              readFile(
                new URL("../../../tools/codekeeper/src/lib/config.mjs", import.meta.url),
                "utf8",
              ),
              readFile(
                new URL("../../../tools/codekeeper/src/lib/schemas.mjs", import.meta.url),
                "utf8",
              ),
            ]);

            assert.match(isolation, /kernel\.unprivileged_userns_clone/);
            assert.match(isolation, /kernel\.apparmor_restrict_unprivileged_userns/);
            assert.match(isolation, /RUNNER_ENVIRONMENT === "github-hosted"/);
            assert.match(isolation, /await prepareCodexLinuxSandbox\(\)/);
            assert.match(
              config,
              /agent\.workspace\.allowWrites && mutationEnabled \? "workspace-write" : "read-only"/,
            );
            assert.match(schemas, /must describe a command that actually ran/);
          });
          EOF

          node --check tools/codekeeper/src/lib/orchestration/workspace-isolation.mjs
          node --check tools/codekeeper/src/lib/schemas.mjs
          node --check tools/codekeeper/test/workspace-sandbox-prerequisites.test.mjs
          node --check packages/codekeeper/test/fixer-sandbox-release.test.mjs
          node --test \
            tools/codekeeper/test/workspace-sandbox-prerequisites.test.mjs \
            packages/codekeeper/test/fixer-sandbox-release.test.mjs
          node tools/codekeeper/scripts/generate-tooling-manifest.mjs --write

          rm .github/workflows/codekeeper-fixer-sandbox-finalizer-temp.yml
          git add -A
          git commit -m 'fix(runtime): prepare Codex sandbox on hosted Ubuntu'
          node scripts/refresh-release-manifest.mjs
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
