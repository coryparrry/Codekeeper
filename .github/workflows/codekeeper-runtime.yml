name: Codekeeper runtime

on:
  workflow_call:
    inputs:
      mode:
        description: Requested Codekeeper mode, or auto for an owner command.
        required: true
        type: string
      package_version:
        description: Exact published Codekeeper package version.
        required: true
        type: string
      package_integrity:
        description: Exact npm SHA-512 integrity for the package tarball.
        required: true
        type: string
      enabled:
        description: Run the Codekeeper runtime.
        required: false
        default: true
        type: boolean
      dry_run:
        description: Seal the result without a live publication for non-gate modes.
        required: false
        default: false
        type: boolean
      automation_bot_login:
        description: Installed GitHub App bot login used by trusted adapters.
        required: false
        default: ""
        type: string
      app_client_id:
        description: GitHub App client ID. The verified mode plan supplies permissions.
        required: true
        type: string
      installed_modes:
        description: Comma-separated modes installed by the verified package.
        required: false
        default: review,maintain,issues,fix
        type: string
      credential_probe:
        description: Prove the stored App key without running a model or mutating the repository.
        required: false
        default: false
        type: boolean
      verification_id:
        description: UUID used to correlate an installer credential probe.
        required: false
        default: ""
        type: string
    secrets:
      model_api_key:
        description: Compatibility key for an explicitly selected legacy mode.
        required: false
      openai_api_key:
        description: OpenAI key selected only from the frozen resolved policy.
        required: false
      deepseek_api_key:
        description: DeepSeek key selected only from the frozen resolved policy.
        required: false
      openrouter_api_key:
        description: OpenRouter key selected only from the frozen resolved policy.
        required: false
      workspace_api_key:
        description: API key for the optional isolated workspace specialist.
        required: false
      trace_api_key:
        description: API key for required Agents SDK trace export.
        required: false
      app_private_key:
        description: GitHub App private key used only after tokenless sealing.
        required: false

permissions:
  contents: read

env:
  CODEKEEPER_PACKAGE_NAME: codekeeper
  CODEKEEPER_PACKAGE_VERSION: ${{ inputs.package_version }}
  CODEKEEPER_PACKAGE_INTEGRITY: ${{ inputs.package_integrity }}

concurrency:
  group: codekeeper-runtime-${{ inputs.mode }}-${{ github.event.inputs.issue_number || github.event.pull_request.number || github.event.issue.number || github.event.client_payload.number || github.repository }}
  cancel-in-progress: false

jobs:
  compute:
    name: Codekeeper generic compute
    if: inputs.enabled && !inputs.credential_probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      resolved_mode: ${{ steps.prepare.outputs.resolved_mode }}
      command_execution_kind: ${{ steps.prepare.outputs.command_execution_kind }}
      validation_required: ${{ steps.prepare.outputs.validation_required }}
      publication_required: ${{ steps.prepare.outputs.publication_required }}
      required_gate: ${{ steps.prepare.outputs.required_gate }}
      contents_permission: ${{ steps.prepare.outputs.contents_permission }}
      issues_permission: ${{ steps.prepare.outputs.issues_permission }}
      pull_requests_permission: ${{ steps.prepare.outputs.pull_requests_permission }}
      context_sha256: ${{ steps.candidate.outputs.context_sha256 || steps.prepare.outputs.context_sha256 }}
      execution_sha: ${{ steps.prepare.outputs.execution_sha }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
      handoff_manifest_sha256: ${{ steps.candidate.outputs.handoff_manifest_sha256 }}
      package_manifest_sha256: ${{ steps.codekeeper-package.outputs.package_manifest_sha256 }}
      package_source_commit: ${{ steps.codekeeper-package.outputs.source_commit }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: repository
          persist-credentials: false

      - name: Check out the frozen execution target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha || github.event.repository.default_branch }}
          fetch-depth: 0
          path: worktree
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Acquire exact Codekeeper package
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"

      - name: Resolve the verified mode plan and prepare the bundle
        id: prepare
        working-directory: worktree
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          INSTALLED_MODES: ${{ inputs.installed_modes }}
          DRY_RUN: ${{ inputs.dry_run }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          COMMAND_CONTEXT: ${{ runner.temp }}/codekeeper-command-context.json
          SOURCE_CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
          AGENT_PROFILE_ROOT: ${{ github.workspace }}/repository/.github/codekeeper/agents
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ steps.codekeeper-package.outputs.source_commit }}
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
          CODEKEEPER_APP_CLIENT_ID: ${{ inputs.app_client_id }}
          REQUESTED_BY: ${{ github.event.client_payload.requested_by || github.actor }}
          TARGET_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.event.client_payload.number }}
          AUTHORIZATION_MODE: ${{ github.event.client_payload.authorization_mode || (github.event_name == 'issues' && 'policy') || 'owner' }}
          EXPECTED_HEAD: ${{ github.event.client_payload.head_sha || github.event.pull_request.head.sha || '' }}
          REVIEW_THREAD_IDS: ${{ toJSON(github.event.client_payload.review_thread_ids || fromJSON('[]')) }}
          TRIAGE_MODE: ${{ (github.event_name == 'issues' || github.event_name == 'issue_comment') && 'automatic' || 'manual' }}
          REPAIR_AUTHORIZED: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODE_PLAN")"
          execution_kind="mode"
          command_args=()
          owner_context_args=()
          if [[ "$REQUESTED_MODE" == "auto" ]]; then
            node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage compute \
              --operation owner-command-context --mode auto --config "$SOURCE_CONFIG" \
              --event "$GITHUB_EVENT_PATH" \
              --automation-bot-login "$CODEKEEPER_AUTOMATION_BOT_LOGIN" \
              --result "$COMMAND_CONTEXT"
            command_values="$(COMMAND_CONTEXT="$COMMAND_CONTEXT" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const value = JSON.parse(readFileSync(process.env.COMMAND_CONTEXT, "utf8"));
              process.stdout.write([value.command, value.surface, value.targetNumber, value.actor, value.executionKind].join("\t"));
            ')"
            IFS=$'\t' read -r command surface TARGET_NUMBER REQUESTED_BY execution_kind <<< "$command_values"
            command_args=(--command "$command" --surface "$surface" --target-number "$TARGET_NUMBER")
            owner_context_args=(--command-context "$COMMAND_CONTEXT")
            TRIAGE_MODE=manual
            AUTHORIZATION_MODE=owner
            EXPECTED_HEAD=""
          fi

          resolver=(node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode "$REQUESTED_MODE" --event "$GITHUB_EVENT_NAME" \
            --event-payload "$GITHUB_EVENT_PATH" --policy-config "$SOURCE_CONFIG" \
            --dry-run-value "$DRY_RUN" "${command_args[@]}")
          if [[ "$REQUESTED_MODE" == "fix" ]]; then
            resolver+=(--ready-label-fix true --target-number "$TARGET_NUMBER")
          elif [[ "$REQUESTED_MODE" == "issues" && -n "$TARGET_NUMBER" ]]; then
            resolver+=(--target-number "$TARGET_NUMBER")
          fi
          "${resolver[@]}" > "$MODE_PLAN"

          MODE="$(MODE_PLAN="$MODE_PLAN" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            process.stdout.write(JSON.parse(readFileSync(process.env.MODE_PLAN, "utf8")).resolvedMode);
          ')"
          if [[ "$execution_kind" == "mode" && ",$INSTALLED_MODES," != *",$MODE,"* ]]; then
            echo "Resolved Codekeeper mode $MODE is not installed" >&2
            exit 1
          fi
          profile=""
          case "$MODE" in
            review) profile="$AGENT_PROFILE_ROOT/pr-reviewer.md" ;;
            issues) profile="$AGENT_PROFILE_ROOT/issue-triager.md" ;;
            maintain) profile="$AGENT_PROFILE_ROOT/repository-auditor.md" ;;
            fix) profile="$AGENT_PROFILE_ROOT/fixer.md" ;;
            *) echo "Unsupported Codekeeper mode: $MODE" >&2; exit 1 ;;
          esac
          profile_args=(--agent-profile-source package --agent-profile-source-sha "$TOOLING_SHA")
          if [[ -f "$profile" ]]; then
            profile_args=(--agent-profile "$profile" \
              --agent-profile-source-sha "$(git -C "$GITHUB_WORKSPACE/repository" rev-parse HEAD)")
          fi

          if [[ "$execution_kind" == "deterministic" ]]; then
            cp "$SOURCE_CONFIG" "$CONFIG"
            node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" check-config --config "$CONFIG"
            DEFAULT_BRANCH="$DEFAULT_BRANCH" CONFIG="$CONFIG" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const config = JSON.parse(readFileSync(process.env.CONFIG, "utf8"));
              if (config.repository.defaultBranch !== process.env.DEFAULT_BRANCH) {
                throw new Error("Configured default branch does not match the trusted event repository");
              }
            '
          else
            common=(node ../tooling/codekeeper-runtime/src/cli.mjs stage compute --operation prepare \
              --mode "$MODE" --config "$CONFIG" --source-config "$SOURCE_CONFIG" \
              --default-branch "$DEFAULT_BRANCH" --mode-plan "$MODE_PLAN" --directory "$BUNDLE" \
              "${profile_args[@]}" "${owner_context_args[@]}" \
              --tooling-sha "$TOOLING_SHA")
            case "$MODE" in
              review)
                "${common[@]}" --event "$GITHUB_EVENT_PATH"
                ;;
              issues)
                "${common[@]}" --event "$GITHUB_EVENT_PATH" --actor "$REQUESTED_BY" \
                  --triage-mode "$TRIAGE_MODE" --target-number "$TARGET_NUMBER"
                ;;
              maintain)
                "${common[@]}" --actor "$GITHUB_ACTOR" --repair-authorized "$REPAIR_AUTHORIZED"
                ;;
              fix)
                "${common[@]}" --event "$GITHUB_EVENT_PATH" --target-number "$TARGET_NUMBER" \
                  --actor "$REQUESTED_BY" --authorization-mode "$AUTHORIZATION_MODE" \
                  --expected-head "$EXPECTED_HEAD" --review-thread-ids "$REVIEW_THREAD_IDS"
                ;;
            esac
          fi

          PLAN_PATH="$MODE_PLAN" CONTEXT_PATH="$BUNDLE/context.json" CONFIG_PATH="$CONFIG" \
            EXECUTION_KIND="$execution_kind" OUTPUT_PATH="$GITHUB_OUTPUT" node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync(process.env.PLAN_PATH, "utf8"));
            const context = process.env.EXECUTION_KIND === "deterministic"
              ? null
              : JSON.parse(readFileSync(process.env.CONTEXT_PATH, "utf8"));
            const runtimeMode = plan.resolvedMode === "issues" ? "issue"
              : plan.resolvedMode === "maintain" ? "audit" : plan.resolvedMode;
            const config = JSON.parse(readFileSync(process.env.CONFIG_PATH, "utf8"));
            const values = {
              resolved_mode: plan.resolvedMode,
              command_execution_kind: process.env.EXECUTION_KIND,
              model_provider: config.ai.agents[runtimeMode].provider,
              validation_required: plan.validationRequired,
              publication_required: plan.publicationRequired,
              required_gate: plan.requiredGate && process.env.EXECUTION_KIND !== "deterministic",
              contents_permission: plan.appPermissions.contents,
              issues_permission: plan.appPermissions.issues,
              pull_requests_permission: plan.appPermissions.pullRequests,
              execution_sha: context?.pullRequest?.headSha ?? context?.baseSha ?? process.env.GITHUB_SHA,
            };
            if (!/^[a-f0-9]{40}$/.test(String(values.execution_sha ?? ""))) {
              throw new Error("Frozen execution SHA is missing or invalid");
            }
            for (const [name, value] of Object.entries(values)) {
              appendFileSync(process.env.OUTPUT_PATH, `${name}=${String(value)}\n`);
            }
          '

          if [[ "$execution_kind" != "deterministic" && ("$MODE" == "fix" || "$MODE" == "review") ]]; then
            execution_sha="$(MODE="$MODE" CONTEXT_PATH="$BUNDLE/context.json" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const context = JSON.parse(readFileSync(process.env.CONTEXT_PATH, "utf8"));
              process.stdout.write(String(process.env.MODE === "review" ? context.pullRequest?.headSha : context.baseSha));
            ')"
            git -c "http.extraheader=AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --no-tags origin "$execution_sha"
            git checkout --detach "$execution_sha"
          fi

      - name: Run the isolated workspace stage
        if: steps.prepare.outputs.command_execution_kind != 'deterministic'
        working-directory: worktree
        env:
          CODEKEEPER_WORKSPACE_API_KEY: ${{ secrets.workspace_api_key }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          CODEX_HOME: ${{ github.workspace }}/codekeeper-codex-home
          QUARANTINE: ${{ runner.temp }}/codekeeper-repository-skills
          WORKSPACE_TEMP: ${{ github.workspace }}/codekeeper-workspace-tmp
          WORKSPACE_USER: codekeeper-workspace
          TOOLING_PATH: ${{ github.workspace }}/tooling
          MODE: ${{ steps.prepare.outputs.resolved_mode }}
          PREPARE_RESULT: ${{ steps.prepare.outputs.result }}
        run: |
          set -euo pipefail
          args=(node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage compute \
            --operation workspace --mode "$MODE" --config "$CONFIG" --directory "$BUNDLE" \
            --mode-plan "$MODE_PLAN" --result "$BUNDLE/workspace-result.json")
          if [[ "$MODE" == "fix" ]]; then
            args+=(--mutation-authorized true --patch "$BUNDLE/workspace.patch")
          elif [[ "$MODE" == "maintain" ]]; then
            args+=(--mutation-authorized "${{ !inputs.dry_run }}" --patch "$BUNDLE/workspace.patch")
          fi
          "${args[@]}"

          # A disabled specialist still has a deterministic handoff: keep the
          # workspace evidence file present so candidate creation never falls
          # through to an ambiguous missing-artifact state.
          if [[ ! -e "$BUNDLE/workspace-result.json" ]]; then
            printf '{"skipped":true}\n' > "$BUNDLE/workspace-result.json"
          fi

          if [[ "$MODE" == "fix" || "$MODE" == "maintain" ]]; then
            base_sha="$(PREPARE_RESULT="$PREPARE_RESULT" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const result = JSON.parse(process.env.PREPARE_RESULT);
              process.stdout.write(String(result.context.baseSha));
            ')"
            git reset --hard "$base_sha"
            git clean -fdx
          fi

      - name: Run the configured coordinator stage
        id: analyze
        if: steps.prepare.outputs.command_execution_kind != 'deterministic'
        working-directory: worktree
        env:
          LEGACY_MODEL_API_KEY: ${{ secrets.model_api_key }}
          OPENAI_MODEL_API_KEY: ${{ secrets.openai_api_key }}
          DEEPSEEK_MODEL_API_KEY: ${{ secrets.deepseek_api_key }}
          OPENROUTER_MODEL_API_KEY: ${{ secrets.openrouter_api_key }}
          CODEKEEPER_TRACE_API_KEY: ${{ secrets.trace_api_key }}
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          REQUESTED_MODE: ${{ inputs.mode }}
          MODE: ${{ steps.prepare.outputs.resolved_mode }}
          MODEL_PROVIDER: ${{ steps.prepare.outputs.model_provider }}
          CONTEXT_SHA: ${{ steps.prepare.outputs.context_sha256 }}
          PREPARE_RESULT: ${{ steps.prepare.outputs.result }}
        run: |
          set -euo pipefail
          case "$MODEL_PROVIDER" in
            openai) model_api_key="$OPENAI_MODEL_API_KEY" ;;
            deepseek) model_api_key="$DEEPSEEK_MODEL_API_KEY" ;;
            openrouter) model_api_key="$OPENROUTER_MODEL_API_KEY" ;;
            *) echo "Unsupported coordinator provider: $MODEL_PROVIDER" >&2; exit 1 ;;
          esac
          if [[ -z "$model_api_key" && "$REQUESTED_MODE" != "auto" ]]; then
            model_api_key="$LEGACY_MODEL_API_KEY"
          fi
          test -n "$model_api_key" || {
            echo "The resolved $MODEL_PROVIDER coordinator credential is missing" >&2
            exit 1
          }
          unset LEGACY_MODEL_API_KEY OPENAI_MODEL_API_KEY DEEPSEEK_MODEL_API_KEY OPENROUTER_MODEL_API_KEY
          args=(node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage compute \
            --operation analyze --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
            --directory "$BUNDLE" --workspace-result "$BUNDLE/workspace-result.json" \
            --expected-context-sha "$CONTEXT_SHA" --result "$BUNDLE/agent-result.json")
          if [[ "$MODE" == "fix" ]]; then
            base_sha="$(PREPARE_RESULT="$PREPARE_RESULT" node --input-type=module -e \
              'process.stdout.write(String(JSON.parse(process.env.PREPARE_RESULT).context.baseSha))')"
            args+=(--expected-base-sha "$base_sha" --workspace-patch "$BUNDLE/workspace.patch")
          elif [[ "$MODE" == "maintain" ]]; then
            args+=(--workspace-patch "$BUNDLE/workspace.patch")
          fi
          CODEKEEPER_MODEL_API_KEY="$model_api_key" "${args[@]}"

      - name: Validate the untrusted candidate
        id: candidate
        working-directory: worktree
        env:
          MODE: ${{ steps.prepare.outputs.resolved_mode }}
          COMMAND_EXECUTION_KIND: ${{ steps.prepare.outputs.command_execution_kind }}
          COMMAND_CONTEXT: ${{ runner.temp }}/codekeeper-command-context.json
          BUNDLE: ${{ github.workspace }}/codekeeper-bundle
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          CONFIG: ${{ runner.temp }}/codekeeper-config.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          TOOLING_SHA: ${{ steps.codekeeper-package.outputs.source_commit }}
          TARGET_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.event.client_payload.number }}
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE" || { echo "Candidate directory already exists" >&2; exit 1; }
          if [[ "$COMMAND_EXECUTION_KIND" == "deterministic" ]]; then
            args=(node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage validate \
              --operation command-candidate --mode "$MODE" --config "$CONFIG" \
              --mode-plan "$MODE_PLAN" --command-context "$COMMAND_CONTEXT" \
              --artifact "$CANDIDATE" --tooling-sha "$TOOLING_SHA")
          else
            args=(node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage validate \
              --operation candidate --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
              --directory "$BUNDLE" --context "$BUNDLE/context.json" --result "$BUNDLE/agent-result.json" \
              --workspace-result "$BUNDLE/workspace-result.json" --artifact "$CANDIDATE" \
              --tooling-sha "$TOOLING_SHA")
            if [[ "$MODE" == "fix" ]]; then args+=(--target-number "$TARGET_NUMBER"); fi
          fi
          "${args[@]}"

      - name: Upload the compute candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-generic-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  validate:
    name: Codekeeper generic validation
    needs: compute
    if: needs.compute.outputs.validation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      handoff_manifest_sha256: ${{ steps.verify.outputs.handoff_manifest_sha256 }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: policy
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Acquire exact Codekeeper package
        id: codekeeper-package
        uses: ./policy/.github/codekeeper/actions/acquire-package
        with:
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"

      - name: Download the compute candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-generic-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate

      - name: Check out the frozen validation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.compute.outputs.execution_sha }}
          fetch-depth: 0
          path: repository
          persist-credentials: false

      - name: Resolve the verified validation mode plan
        working-directory: policy
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          MODE: ${{ needs.compute.outputs.resolved_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          COMMAND_CONTEXT: ${{ runner.temp }}/codekeeper-command-context.json
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
          TARGET_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.event.client_payload.number }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODE_PLAN")"
          command_args=()
          if [[ "$REQUESTED_MODE" == "auto" ]]; then
            node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage compute \
              --operation owner-command-context --mode auto --config "$CONFIG" \
              --event "$GITHUB_EVENT_PATH" \
              --automation-bot-login "$CODEKEEPER_AUTOMATION_BOT_LOGIN" \
              --result "$COMMAND_CONTEXT"
            command_values="$(COMMAND_CONTEXT="$COMMAND_CONTEXT" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const value = JSON.parse(readFileSync(process.env.COMMAND_CONTEXT, "utf8"));
              process.stdout.write([value.command, value.surface, value.targetNumber].join("\t"));
            ')"
            IFS=$'\t' read -r command surface TARGET_NUMBER <<< "$command_values"
            command_args=(--command "$command" --surface "$surface" --target-number "$TARGET_NUMBER")
          fi
          args=(node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode "$REQUESTED_MODE" --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --policy-config "$CONFIG" --dry-run-value "$DRY_RUN" "${command_args[@]}")
          if [[ "$REQUESTED_MODE" == "fix" ]]; then
            args+=(--ready-label-fix true --target-number "$TARGET_NUMBER")
          elif [[ "$REQUESTED_MODE" == "issues" && -n "$TARGET_NUMBER" ]]; then
            args+=(--target-number "$TARGET_NUMBER")
          fi
          "${args[@]}" > "$MODE_PLAN"

      - name: Verify the repair candidate without credentials
        id: verify
        working-directory: repository
        env:
          MODE: ${{ needs.compute.outputs.resolved_mode }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          TOOLING_SHA: ${{ steps.codekeeper-package.outputs.source_commit }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.compute.outputs.candidate_sha256 }}
          EXPECTED_HANDOFF_SHA: ${{ needs.compute.outputs.handoff_manifest_sha256 }}
          TARGET_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.event.client_payload.number }}
        run: |
          set -euo pipefail
          args=(node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage validate \
            --operation verify --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
            --candidate "$CANDIDATE" --expected-candidate-sha "$EXPECTED_CANDIDATE_SHA" \
            --expected-handoff-manifest-sha "$EXPECTED_HANDOFF_SHA" --tooling-sha "$TOOLING_SHA")
          if [[ "$MODE" == "fix" ]]; then args+=(--target-number "$TARGET_NUMBER"); fi
          "${args[@]}"

      - name: Upload the verified candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codekeeper-generic-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  publish:
    name: ${{ (inputs.mode == 'review' || needs.compute.outputs.required_gate == 'true') && 'Codekeeper review gate' || 'Codekeeper trusted publication' }}
    needs: [compute, validate]
    if: >-
      always() &&
      (
        inputs.mode == 'review' ||
        needs.compute.outputs.required_gate == 'true' ||
        (
          needs.compute.result == 'success' &&
          (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
          (
            needs.compute.outputs.publication_required == 'true' ||
            inputs.dry_run
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Fail closed when review compute did not complete
        if: (inputs.mode == 'review' || needs.compute.outputs.required_gate == 'true') && needs.compute.result != 'success'
        run: |
          echo "Codekeeper did not compute a current review; this required gate fails closed." >&2
          exit 1

      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: policy
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Acquire exact Codekeeper package
        id: codekeeper-package
        uses: ./policy/.github/codekeeper/actions/acquire-package
        with:
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}

      - name: Install exact Codekeeper runtime
        run: node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/install-runtime.mjs"

      - name: Download the verified candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codekeeper-generic-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/codekeeper-candidate

      - name: Check out the frozen publication target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.compute.outputs.execution_sha }}
          fetch-depth: 0
          path: publication
          persist-credentials: false

      - name: Resolve the verified publication mode plan
        working-directory: policy
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          MODE: ${{ needs.compute.outputs.resolved_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          COMMAND_CONTEXT: ${{ runner.temp }}/codekeeper-command-context.json
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
          TARGET_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.event.client_payload.number }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODE_PLAN")"
          command_args=()
          if [[ "$REQUESTED_MODE" == "auto" ]]; then
            node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage compute \
              --operation owner-command-context --mode auto --config "$CONFIG" \
              --event "$GITHUB_EVENT_PATH" \
              --automation-bot-login "$CODEKEEPER_AUTOMATION_BOT_LOGIN" \
              --result "$COMMAND_CONTEXT"
            command_values="$(COMMAND_CONTEXT="$COMMAND_CONTEXT" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const value = JSON.parse(readFileSync(process.env.COMMAND_CONTEXT, "utf8"));
              process.stdout.write([value.command, value.surface, value.targetNumber].join("\t"));
            ')"
            IFS=$'\t' read -r command surface TARGET_NUMBER <<< "$command_values"
            command_args=(--command "$command" --surface "$surface" --target-number "$TARGET_NUMBER")
          fi
          args=(node "$GITHUB_WORKSPACE/tooling/tools/codekeeper/bin/resolve-mode-plan.mjs" \
            --mode "$REQUESTED_MODE" --event "$GITHUB_EVENT_NAME" --event-payload "$GITHUB_EVENT_PATH" \
            --policy-config "$CONFIG" --dry-run-value "$DRY_RUN" "${command_args[@]}")
          if [[ "$REQUESTED_MODE" == "fix" ]]; then
            args+=(--ready-label-fix true --target-number "$TARGET_NUMBER")
          elif [[ "$REQUESTED_MODE" == "issues" && -n "$TARGET_NUMBER" ]]; then
            args+=(--target-number "$TARGET_NUMBER")
          fi
          "${args[@]}" > "$MODE_PLAN"

      - name: Seal the candidate before App credentials
        id: seal
        working-directory: policy
        env:
          MODE: ${{ needs.compute.outputs.resolved_mode }}
          COMMAND_EXECUTION_KIND: ${{ needs.compute.outputs.command_execution_kind }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          CANDIDATE: ${{ runner.temp }}/codekeeper-candidate
          ARTIFACT: ${{ runner.temp }}/codekeeper-artifact
          TOOLING_SHA: ${{ steps.codekeeper-package.outputs.source_commit }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.compute.outputs.candidate_sha256 }}
          EXPECTED_CONTEXT_SHA: ${{ needs.compute.outputs.context_sha256 }}
          EXPECTED_HANDOFF_SHA: ${{ needs.validate.result == 'success' && needs.validate.outputs.handoff_manifest_sha256 || needs.compute.outputs.handoff_manifest_sha256 }}
        run: |
          set -euo pipefail
          test ! -e "$ARTIFACT" || { echo "Sealed artifact directory already exists" >&2; exit 1; }
          operation=seal
          if [[ "$COMMAND_EXECUTION_KIND" == "deterministic" ]]; then operation=command-seal; fi
          args=(node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage validate \
            --operation "$operation" --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
            --candidate "$CANDIDATE" --artifact "$ARTIFACT" \
            --expected-candidate-sha "$EXPECTED_CANDIDATE_SHA" \
            --expected-context-sha "$EXPECTED_CONTEXT_SHA" \
            --expected-handoff-manifest-sha "$EXPECTED_HANDOFF_SHA" \
            --tooling-sha "$TOOLING_SHA")
          "${args[@]}"

      - name: Validate App permissions from the verified mode plan
        id: preconditions
        if: >-
          steps.seal.outcome == 'success' &&
          (
            inputs.mode == 'review' ||
            needs.compute.outputs.required_gate == 'true' ||
            (!inputs.dry_run && needs.compute.outputs.publication_required == 'true')
          )
        working-directory: policy
        env:
          MODE: ${{ needs.compute.outputs.resolved_mode }}
          DRY_RUN: ${{ inputs.dry_run && inputs.mode != 'review' && needs.compute.outputs.required_gate != 'true' }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          APP_CLIENT_ID: ${{ inputs.app_client_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
          CONTENTS_PERMISSION: ${{ needs.compute.outputs.contents_permission }}
          ISSUES_PERMISSION: ${{ needs.compute.outputs.issues_permission }}
          PULL_REQUESTS_PERMISSION: ${{ needs.compute.outputs.pull_requests_permission }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage publish \
            --operation preconditions --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
            --dry-run "$DRY_RUN" \
            --app-contents-permission "$CONTENTS_PERMISSION" \
            --app-issues-permission "$ISSUES_PERMISSION" \
            --app-pull-requests-permission "$PULL_REQUESTS_PERMISSION"

      - name: Create the short-lived GitHub App token
        id: app-token
        if: >-
          steps.preconditions.outcome == 'success' &&
          (!inputs.dry_run || inputs.mode == 'review' || needs.compute.outputs.required_gate == 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: ${{ needs.compute.outputs.contents_permission }}
          permission-issues: ${{ needs.compute.outputs.issues_permission }}
          permission-pull-requests: ${{ needs.compute.outputs.pull_requests_permission }}

      - name: Resolve immutable automation bot identity
        id: bot
        if: steps.app-token.outcome == 'success'
        working-directory: policy
        env:
          MODE: ${{ needs.compute.outputs.resolved_mode }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
        run: |
          node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage publish \
            --operation bot --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
            --token "$GITHUB_TOKEN" --app-slug "$APP_SLUG" --api-url "$GITHUB_API_URL"

      - name: Publish the sealed result
        id: publish-result
        if: steps.app-token.outcome == 'success'
        working-directory: publication
        env:
          MODE: ${{ needs.compute.outputs.resolved_mode }}
          COMMAND_EXECUTION_KIND: ${{ needs.compute.outputs.command_execution_kind }}
          INSTALLED_MODES: ${{ inputs.installed_modes }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CODEKEEPER_AUTOMATION_BOT_LOGIN: ${{ steps.bot.outputs.login }}
          CODEKEEPER_AUTOMATION_BOT_ID: ${{ steps.bot.outputs.id }}
          CONFIG: ${{ github.workspace }}/policy/.github/codekeeper.json
          MODE_PLAN: ${{ runner.temp }}/codekeeper-mode-plan/plan.json
          ARTIFACT: ${{ runner.temp }}/codekeeper-artifact
          TOOLING_SHA: ${{ steps.codekeeper-package.outputs.source_commit }}
          AGENT_PROFILE: ${{ github.workspace }}/policy/.github/codekeeper/agents
          MANIFEST_SHA: ${{ steps.seal.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          case "$MODE" in
            review) profile="$AGENT_PROFILE/pr-reviewer.md" ;;
            issues) profile="$AGENT_PROFILE/issue-triager.md" ;;
            maintain) profile="$AGENT_PROFILE/repository-auditor.md" ;;
            fix) profile="$AGENT_PROFILE/fixer.md" ;;
            *) echo "Unsupported Codekeeper mode: $MODE" >&2; exit 1 ;;
          esac
          profile_args=(--agent-profile-source package --agent-profile-source-sha "$TOOLING_SHA")
          if [[ -f "$profile" ]]; then
            profile_args=(--agent-profile "$profile" \
              --agent-profile-source-sha "$(git -C "$GITHUB_WORKSPACE/policy" rev-parse HEAD)")
          fi
          if [[ "$COMMAND_EXECUTION_KIND" == "deterministic" ]]; then
            node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage publish \
              --operation command --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
              --event "$GITHUB_EVENT_PATH" --automation-bot-login "$CODEKEEPER_AUTOMATION_BOT_LOGIN" \
              --automation-bot-id "$CODEKEEPER_AUTOMATION_BOT_ID" --installed-modes "$INSTALLED_MODES" \
              --token "$GITHUB_TOKEN" --artifact "$ARTIFACT" --expected-manifest-sha "$MANIFEST_SHA"
          else
            node "$GITHUB_WORKSPACE/tooling/codekeeper-runtime/src/cli.mjs" stage publish \
              --operation publish --mode "$MODE" --config "$CONFIG" --mode-plan "$MODE_PLAN" \
              "${profile_args[@]}" \
              --tooling-sha "$TOOLING_SHA" --artifact "$ARTIFACT" \
              --expected-manifest-sha "$MANIFEST_SHA"
          fi

      - name: Record a tokenless dry-run seal
        if: >-
          steps.seal.outcome == 'success' &&
          steps.app-token.outcome != 'success'
        run: echo "Codekeeper sealed a dry-run result without minting an App token."

      - name: Enforce the required review gate
        if: always() && (inputs.mode == 'review' || needs.compute.outputs.required_gate == 'true')
        env:
          ENABLED: ${{ inputs.enabled }}
          COMPUTE_RESULT: ${{ needs.compute.result }}
          SEAL_RESULT: ${{ steps.seal.outcome }}
          PUBLISH_DISPOSITION: ${{ steps.publish-result.outputs.result != '' && fromJSON(steps.publish-result.outputs.result).disposition || '' }}
          PUBLISH_BLOCKING: ${{ steps.publish-result.outputs.result != '' && fromJSON(steps.publish-result.outputs.result).blocking || false }}
        run: |
          set -euo pipefail
          [[ "$ENABLED" == "true" ]] || {
            echo "Codekeeper is disabled; this required gate fails closed." >&2
            exit 1
          }
          [[ "$COMPUTE_RESULT" == "success" && "$SEAL_RESULT" == "success" ]] || {
            echo "Codekeeper did not seal a current review." >&2
            exit 1
          }
          case "$PUBLISH_DISPOSITION" in
            published)
              [[ "$PUBLISH_BLOCKING" != "true" ]] || {
                echo "Codekeeper published blocking findings for the current pull request head." >&2
                exit 1
              }
              ;;
            manual|unsupported)
              echo "Codekeeper returned a manual-review disposition without mutation."
              ;;
            *)
              echo "Codekeeper did not produce a sealed live review disposition." >&2
              exit 1
              ;;
          esac

  credential-probe:
    name: Codekeeper App credential verification
    if: inputs.enabled && inputs.credential_probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          path: repository
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Acquire exact Codekeeper package
        id: codekeeper-package
        uses: ./repository/.github/codekeeper/actions/acquire-package
        with:
          package_version: ${{ inputs.package_version }}
          package_integrity: ${{ inputs.package_integrity }}

      - name: Validate the probe and derive registered permissions
        id: permissions
        env:
          VERIFICATION_ID: ${{ inputs.verification_id }}
          INSTALLED_MODES: ${{ inputs.installed_modes }}
          CONFIG: ${{ github.workspace }}/repository/.github/codekeeper.json
        run: |
          set -euo pipefail
          [[ "$VERIFICATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
            echo "Invalid Codekeeper verification correlation ID" >&2
            exit 1
          }
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const modulePath = `${process.env.GITHUB_WORKSPACE}/tooling/tools/codekeeper/src/app-permissions.mjs`;
          const { registrationAppPermissions } = await import(pathToFileURL(modulePath));
          const policy = JSON.parse(readFileSync(process.env.CONFIG, "utf8"));
          const modes = process.env.INSTALLED_MODES.split(",").filter(Boolean);
          const permissions = registrationAppPermissions({
            modes,
            capabilities: {
              reviewRepair: policy.review?.autoRepair === true,
              repair: policy.audit?.repair?.enabled === true,
              issueImplementation: policy.issues?.allowAiImplementation === true,
              autoMerge: policy.merge?.enabled === true,
            },
            ownerRequests: policy.automation?.ownerRequests === true,
          });
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `contents=${permissions.contents}`,
            `issues=${permissions.issues}`,
            `pull_requests=${permissions.pullRequests}`,
            "",
          ].join("\n"));
          NODE

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: ${{ steps.permissions.outputs.contents }}
          permission-issues: ${{ steps.permissions.outputs.issues }}
          permission-pull-requests: ${{ steps.permissions.outputs.pull_requests }}

      - name: Prove App identity, installation, and repository access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          AUTOMATION_BOT_LOGIN: ${{ inputs.automation_bot_login }}
        run: |
          set -euo pipefail
          expected_slug="${AUTOMATION_BOT_LOGIN%\[bot\]}"
          test -n "$expected_slug"
          test "$APP_SLUG" = "$expected_slug"
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)" = "$GITHUB_REPOSITORY"
