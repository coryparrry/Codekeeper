name: Set up Codekeeper Node toolchain
description: Install the pinned Node and npm toolchain used by repository-owned checks
inputs:
  node-version:
    description: Exact Node.js version to install
    required: true
  install-npm:
    description: Install Codekeeper's pinned npm version
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Validate toolchain inputs
      shell: bash
      env:
        CODEKEEPER_NODE_VERSION: ${{ inputs.node-version }}
        CODEKEEPER_INSTALL_NPM: ${{ inputs.install-npm }}
      run: |
        set -euo pipefail
        [[ "$CODEKEEPER_NODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "node-version must be an exact semantic version" >&2
          exit 1
        }
        [[ "$CODEKEEPER_INSTALL_NPM" == "true" || "$CODEKEEPER_INSTALL_NPM" == "false" ]] || {
          echo "install-npm must be true or false" >&2
          exit 1
        }
    - name: Set up exact Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Install pinned npm
      if: inputs.install-npm == 'true'
      shell: bash
      run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
